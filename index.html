<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>DIEPE TRIP</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <style>
    #loader{position:fixed;inset:0;background:#070510;color:#d8b0ff;z-index:99999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;font-family:monospace;text-align:center;padding:20px}
    #ldPct{font-size:52px;margin:12px 0}
    #ldPhase{font-size:16px;color:#8a7aa8}
    #ldErr{font-size:14px;color:#ff6a8a;max-width:90%;white-space:pre-wrap;margin-top:16px}
  </style>
  <script>
  // =========================================================
  //  DIEPE TRIP v7.0 — sneller, wilder, Thumper-energie
  // =========================================================
  window.PHASE='menu'; window.RIG=null; window.CAM=null;
  window.DIST=0; window.SPEED=0; window.SCENE=-1; window.BEAT=0;

  const SCENES=[
    {name:'ontwaken', len:160, sp:5,            bg:'#070510', fogD:0.026, mus:{root:110.0, mode:[0,3,5,7,10],    bpm:72,  four:0, arp:0.4,  bright:1000, pad:1}},
    {name:'mandala',  len:360, sp:8,            bg:'#12061e', fogD:0.018, mus:{root:130.8, mode:[0,2,4,7,9],     bpm:96,  four:0, arp:0.55, bright:1500, pad:1}},
    {name:'sterren',  len:1100, sp:34,          bg:'#020208', fogD:0.009, mus:{root:110.0, mode:[0,2,4,7,9],     bpm:138, four:1, trance:1, arp:0.5, bright:2600}},
    {name:'kristal',  len:360, sp:8,            bg:'#04101a', fogD:0.014, mus:{root:146.8, mode:[0,2,4,7,9,11],  bpm:90,  four:0, arp:0.5,  bright:1700, pad:1}},
    {name:'diepzee',  len:340, sp:6.5,          bg:'#03202a', fogD:0.03,  mus:{root:98.0,  mode:[0,4,7,11],      bpm:66,  four:0, arp:0.3,  bright:1200, pad:1}},
    {name:'tempel',   len:460, sp:9,            bg:'#0a1216', fogD:0.016, mus:{root:98.0,  mode:[0,2,4,7,9,11],  bpm:80,  four:0, arp:0.45, bright:1500, pad:1}},
    {name:'puls',     len:520, sp:10,           bg:'#0a0406', fogD:0.028, mus:{root:87.3,  mode:[0,1,6,7],       bpm:112, pound:1, arp:0.15, bright:700}},
    {name:'stad',     len:800, sp:16,           bg:'#0c0616', fogD:0.014, mus:{root:110.0, mode:[0,3,5,7,10],    bpm:126, four:1, trance:1, arp:0.55, bright:2200}},
    {name:'chaos',    len:640, sp:14,           bg:'#140410', fogD:0.016, mus:{root:116.5, mode:[0,1,4,6,7,10],  bpm:140, four:1, trance:1, acid:1, arp:0.6, bright:2400}},
    {name:'storm',    len:360, sp:7,            bg:'#0a0e18', fogD:0.03,  mus:{root:73.4,  mode:[0,1,3,7,8],     bpm:60,  four:0, arp:0.2,  bright:600,  pad:1}},
    {name:'vortex',   len:1200, sp:40,          bg:'#0a0214', fogD:0.012, mus:{root:123.5, mode:[0,3,5,7,10],    bpm:150, four:1, trance:1, acid:1, arp:0.65, bright:2800}},
    {name:'grot',     len:230, sp:4.5,          bg:'#030204', fogD:0.045, mus:{root:82.4,  mode:[0,1,3,6,8],     bpm:56,  four:0, arp:0.25, bright:500,  pad:1}},
    {name:'licht',    len:1000, sp:22, spEnd:52, bg:'#2a1a0a', fogD:0.007, mus:{root:174.6, mode:[0,2,4,5,7,9,11],bpm:136, four:1, trance:1, arp:0.6, bright:3000}}
  ];
  SCENES.forEach(s=>{ s.len*=3; s.sp*=3; if(s.spEnd)s.spEnd*=3; });
  let TOTAL=0; SCENES.forEach(s=>{ s.z0=-TOTAL; TOTAL+=s.len; s.z1=-TOTAL; });
  const SKYH={ontwaken:[230,300],mandala:[270,330],sterren:[200,260],kristal:[180,230],diepzee:[180,215],tempel:[165,205],puls:[335,365],stad:[285,335],chaos:[280,360],storm:[205,235],vortex:[250,320],grot:[255,290],licht:[28,55]};
  SCENES.forEach(s=>{ s.skyH=SKYH[s.name]; });

  const $=q=>document.querySelector(q);
  const rand=(a,b)=>a+Math.random()*(b-a);
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const sgn=()=>Math.random()<0.5?1:-1;
  const hsl=(h,s,l)=>'hsl('+Math.round((h%360+360)%360)+','+Math.round(s)+'%,'+Math.round(l)+'%)';

  // =========================================================
  //  MUZIEK v2 — echte track (music/track.mp3) of trance-engine
  //  met sidechain, supersaw, akkoordenschema en melodie
  // =========================================================
  let A=null, MASTER=null, DUCK=null, DELAY=null, DRONE=null;
  let TRACK=null, ANA=null, ANAD=null;
  function AC(){ if(A) return A; A=new (window.AudioContext||window.webkitAudioContext)();
    MASTER=A.createGain(); MASTER.gain.value=0.5; MASTER.connect(A.destination);
    DUCK=A.createGain(); DUCK.gain.value=1; DUCK.connect(MASTER);
    DELAY=A.createDelay(1.2); DELAY.delayTime.value=0.32;
    const fb=A.createGain(); fb.gain.value=0.42; const fl=A.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=3200;
    const dw=A.createGain(); dw.gain.value=0.5;
    DELAY.connect(fl).connect(fb).connect(DELAY); DELAY.connect(dw).connect(DUCK);
    return A; }
  function tryTrack(){ const au=new Audio(); au.src='music/track.mp3'; au.loop=true;
    au.addEventListener('canplaythrough',function(){ TRACK=au; },{once:true});
    au.addEventListener('error',function(){ TRACK=null; }); au.load(); }
  function duckNow(t){ if(!DUCK)return; DUCK.gain.cancelScheduledValues(t);
    DUCK.gain.setValueAtTime(0.32,t); DUCK.gain.linearRampToValueAtTime(1.0,t+0.22); }
  function supersaw(f,t,dur,vol,dest,att,bright){ const a=AC(); const g=a.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+(att||0.02));
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    const fl=a.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=bright||2400;
    [-9,0,9].forEach(function(d){ const o=a.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.detune.value=d;
      o.connect(fl); o.start(t); o.stop(t+dur+0.05); });
    fl.connect(g).connect(dest||DUCK); }
  function note(f,t,dur,vol,type,dest,att){ const a=AC(); const o=a.createOscillator(); o.type=type||'sine'; o.frequency.value=f;
    const g=a.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+(att||0.02));
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(dest||DUCK); o.start(t); o.stop(t+dur+0.05); }
  function kickAt(t,vol){ const a=AC(); const o=a.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(36,t+0.11);
    const g=a.createGain(); g.gain.setValueAtTime(vol||0.85,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.18);
    o.connect(g).connect(MASTER); o.start(t); o.stop(t+0.22);
    const len=Math.floor(a.sampleRate*0.012); const b=a.createBuffer(1,len,a.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const n=a.createBufferSource(); n.buffer=b; const hf=a.createBiquadFilter(); hf.type='highpass'; hf.frequency.value=3000;
    const ng=a.createGain(); ng.gain.value=(vol||0.85)*0.35; n.connect(hf).connect(ng).connect(MASTER); n.start(t);
    duckNow(t);
    const ms=Math.max(0,(t-a.currentTime)*1000); setTimeout(function(){ window.BEAT=1; },ms); }
  function hatAt(t,vol,open){ const a=AC(); const dur=open?0.12:0.035;
    const len=Math.floor(a.sampleRate*dur); const b=a.createBuffer(1,len,a.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,open?1.2:2);
    const n=a.createBufferSource(); n.buffer=b; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=7500;
    const g=a.createGain(); g.gain.value=vol||0.12; n.connect(f).connect(g).connect(MASTER); n.start(t); }
  function clankAt(t){ const a=AC(); const len=Math.floor(a.sampleRate*0.12); const b=a.createBuffer(1,len,a.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.4);
    const n=a.createBufferSource(); n.buffer=b; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1100; f.Q.value=8;
    const g=a.createGain(); g.gain.value=0.35; n.connect(f).connect(g).connect(MASTER); n.start(t); }
  function acidAt(f,t){ const a=AC(); const o=a.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
    const flt=a.createBiquadFilter(); flt.type='lowpass'; flt.Q.value=14;
    flt.frequency.setValueAtTime(280,t); flt.frequency.exponentialRampToValueAtTime(2400,t+0.08); flt.frequency.exponentialRampToValueAtTime(340,t+0.22);
    const g=a.createGain(); g.gain.setValueAtTime(0.085,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.24);
    o.connect(flt).connect(g).connect(DUCK); o.start(t); o.stop(t+0.3); }
  function riser(){ const a=AC(); const t=a.currentTime; const len=Math.floor(a.sampleRate*2); const b=a.createBuffer(1,len,a.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(i/len);
    const n=a.createBufferSource(); n.buffer=b; const f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=2;
    f.frequency.setValueAtTime(200,t); f.frequency.exponentialRampToValueAtTime(4500,t+2);
    const g=a.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.2,t+1.6); g.gain.linearRampToValueAtTime(0,t+2.1);
    n.connect(f).connect(g).connect(MASTER); n.start(t); }
  function startDrone(){ const a=AC(); if(DRONE) return;
    const o1=a.createOscillator(); o1.type='sawtooth'; const o2=a.createOscillator(); o2.type='sawtooth'; o2.detune.value=9;
    const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=500;
    const lfo=a.createOscillator(); lfo.frequency.value=0.08; const lg=a.createGain(); lg.gain.value=260; lfo.connect(lg).connect(f.frequency); lfo.start();
    const g=a.createGain(); g.gain.value=0.045;
    o1.connect(f); o2.connect(f); f.connect(g).connect(DUCK); o1.start(); o2.start();
    DRONE={o1:o1,o2:o2,f:f}; }
  const MUS={cfg:null, nextT:0, step:0, phrase:[]};
  function makePhrase(c){ const ph=[]; for(let i=0;i<16;i++){
      if(i===0){ ph.push(0); continue; }
      ph.push(Math.random()<0.55 ? pick(c.mode)+12*Math.floor(Math.random()*2) : null); } return ph; }
  function setMusic(cfg){ const a=AC(); MUS.cfg=cfg; MUS.step=0;
    cfg.prog=(cfg.mode.indexOf(4)>=0)?[0,9,5,7]:[0,8,3,10]; // majeur- of mineur-schema
    MUS.phrase=makePhrase(cfg);
    if(DRONE){ DRONE.o1.frequency.linearRampToValueAtTime(cfg.root/2, a.currentTime+2.5);
      DRONE.o2.frequency.linearRampToValueAtTime(cfg.root/2*1.004, a.currentTime+2.5);
      DRONE.f.frequency.linearRampToValueAtTime(Math.max(300,cfg.bright*0.35), a.currentTime+2.5); } }
  function musTick(){ if(!A||!MUS.cfg||window.PHASE!=='trip'||window.USE_TRACK) return; const a=A, c=MUS.cfg;
    const stepDur=60/c.bpm/4;
    if(MUS.nextT<a.currentTime) MUS.nextT=a.currentTime+0.05;
    while(MUS.nextT<a.currentTime+0.28){
      const t=MUS.nextT, i=MUS.step;
      const bar=Math.floor(i/16), pos=i%16, sect=bar%16;
      const chord=c.root*Math.pow(2,(c.prog[Math.floor(bar/2)%4])/12);
      if(pos===0 && bar%8===0) MUS.phrase=makePhrase(c);
      if((c.pad||c.four) && i%32===0){
        supersaw(chord,t,4.6,0.07,DUCK,1.6,1400);
        supersaw(chord*Math.pow(2,(c.mode.indexOf(3)>=0?3:4)/12),t,4.6,0.05,DUCK,1.8,1300);
        supersaw(chord*1.4983,t,4.6,0.05,DUCK,2.0,1300); }
      if(c.four){
        if(pos%4===0) kickAt(t,0.9);
        else note(chord/2,t,0.12,0.17,'sawtooth',DUCK,0.004);                    // rollende bas
        if(sect>=2){ hatAt(t, pos%4===2?0.13:0.045); }
        if(pos===14 && Math.random()<0.4) hatAt(t,0.1,true);
        if(sect>=1 && MUS.phrase[pos]!=null){                                     // melodie-hook
          supersaw(c.root*2*Math.pow(2,MUS.phrase[pos]/12),t,0.24,0.06,DELAY,0.01,c.bright); }
        if(c.acid && sect>=6 && pos%2===0 && Math.random()<0.5){
          acidAt(c.root*Math.pow(2,pick(c.mode)/12)*(Math.random()<0.3?2:1),t); }
        if(sect===15) hatAt(t,0.04+pos*0.007);                                    // opbouw naar drop
      } else if(c.pound){
        if(i%8===0) kickAt(t,1.0); if(i%16===8) clankAt(t);
        if(i%16===12&&Math.random()<0.4) kickAt(t,0.5);
        if(i%64===32){ supersaw(c.root*2,t,0.5,0.07,DUCK,0.01,900);
          supersaw(c.root*2*Math.pow(2,1/12),t,0.5,0.05,DUCK,0.01,900); }         // dissonante stoot
      } else {
        if(i%16===0) note(chord/2,t,1.8,0.15,'sine',DUCK,0.05);
        if(pos%2===0 && MUS.phrase[pos]!=null)
          note(c.root*2*Math.pow(2,MUS.phrase[pos]/12),t,0.5,0.07,'sine',DELAY,0.01); }
      if(Math.random()<(c.arp||0)*0.4){ const sem=pick(c.mode)+24;
        note(c.root*Math.pow(2,sem/12),t,0.35,0.05,'sine',DELAY,0.01); }
      MUS.nextT+=stepDur; MUS.step++;
    } }
  setInterval(musTick,85);

  // =========================================================
  //  BOUWSTENEN
  // =========================================================
  const W_=()=>$('#world');
  function E(tag,attrs,parent){ const e=document.createElement(tag); for(const k in attrs) e.setAttribute(k,attrs[k]); (parent||W_()).appendChild(e); return e; }
  function glow(color,extra){ return 'color:'+color+';emissive:'+color+';emissiveIntensity:1.4;shader:flat'+(extra||''); }
  // zachte gloed-schil (nep-bloom via additive blending)
  function halo(parent,r,color,op){ return E('a-sphere',{radius:r,material:'color:'+color+';shader:flat;transparent:true;opacity:'+(op||0.16)+';blending:additive',nodw:''},parent); }
  AFRAME.registerComponent('nodw',{ init:function(){ const el=this.el;
    const fix=function(){ const m=el.getObject3D('mesh'); if(m&&m.material){ m.material.depthWrite=false; } };
    el.addEventListener('object3dset',fix); el.addEventListener('loaded',fix); } });
  AFRAME.registerComponent('nofog',{ init:function(){ const el=this.el;
    const fix=function(){ const m=el.getObject3D('mesh'); if(m&&m.material){ m.material.fog=false; } };
    el.addEventListener('object3dset',fix); el.addEventListener('loaded',fix); } });

  // ---- procedurele textures (nevel-lucht, planeten) ----
  function nebulaTex(hues){ const cv=document.createElement('canvas'); cv.width=1024; cv.height=512; const x=cv.getContext('2d');
    x.fillStyle='#020207'; x.fillRect(0,0,1024,512);
    for(let i=0;i<10;i++){ const cx=Math.random()*1024, cy=Math.random()*512, r=90+Math.random()*260;
      const h=hues[0]+Math.random()*(hues[1]-hues[0]);
      const g=x.createRadialGradient(cx,cy,0,cx,cy,r);
      g.addColorStop(0,'hsla('+h+',80%,55%,'+(0.10+Math.random()*0.12)+')');
      g.addColorStop(1,'hsla('+h+',80%,50%,0)');
      x.fillStyle=g; x.beginPath(); x.arc(cx,cy,r,0,7); x.fill(); }
    x.fillStyle='#fff';
    for(let i=0;i<280;i++){ const sz=Math.random()*1.6; x.globalAlpha=0.3+Math.random()*0.7; x.fillRect(Math.random()*1024,Math.random()*512,sz,sz); }
    x.globalAlpha=1;
    for(let i=0;i<8;i++){ const cx=Math.random()*1024, cy=Math.random()*512;
      const g=x.createRadialGradient(cx,cy,0,cx,cy,6); g.addColorStop(0,'rgba(255,255,255,0.9)'); g.addColorStop(1,'rgba(255,255,255,0)');
      x.fillStyle=g; x.beginPath(); x.arc(cx,cy,6,0,7); x.fill(); }
    return new THREE.CanvasTexture(cv); }
  function planetTex(baseH){ const cv=document.createElement('canvas'); cv.width=512; cv.height=256; const x=cv.getContext('2d');
    for(let y=0;y<256;y++){ const h=baseH+Math.sin(y*0.11)*14+Math.sin(y*0.031)*10;
      const l=26+Math.sin(y*0.23)*8+Math.sin(y*0.052)*7;
      x.fillStyle='hsl('+Math.round(h)+',55%,'+Math.round(l)+'%)'; x.fillRect(0,y,512,1); }
    x.globalAlpha=0.08; x.fillStyle='#000';
    for(let i=0;i<60;i++){ x.fillRect(Math.random()*512, Math.random()*256, 30+Math.random()*90, 1+Math.random()*3); }
    x.globalAlpha=1; return new THREE.CanvasTexture(cv); }
  AFRAME.registerComponent('ptex',{ schema:{h:{default:200}}, init:function(){ const el=this.el; const t=planetTex(this.data.h);
    const ap=function(){ const m=el.getObject3D('mesh'); if(m){ m.material.map=t; m.material.needsUpdate=true; } };
    el.addEventListener('object3dset',ap); if(el.getObject3D('mesh'))ap(); } });
  function setSkyTex(tex){ const sky=$('#sky'); if(!sky)return;
    const ap=function(){ const m=sky.getObject3D('mesh'); if(m){ m.material.map=tex; m.material.color.set('#ffffff'); m.material.needsUpdate=true; } };
    if(sky.getObject3D('mesh'))ap(); else sky.addEventListener('loaded',ap); }
  function planet(x,y,z,r,h){ const p=E('a-sphere',{position:x+' '+y+' '+z,radius:r,material:'color:#ffffff;shader:flat','ptex':'h: '+h,spin:'y:0.02'});
    E('a-torus',{radius:r*1.7,'radius-tubular':r*0.05,rotation:'75 0 15',material:glow('#cfd8ff')+';transparent:true;opacity:0.45'},p); return p; }
  // "edelsteen": donkere kern + oplichtend draadframe + gloed (pro-look, vervangt de knopen)
  function gem(p,r,color,parent){ const g=E('a-entity',{position:p.x+' '+p.y+' '+p.z,spin:'x:'+sgn()*rand(0.3,0.9)+'; y:'+sgn()*rand(0.3,0.9)},parent);
    E('a-octahedron',{radius:r,material:'color:#0a0c14;shader:flat'},g);
    E('a-octahedron',{radius:r*1.03,material:'color:'+color+';shader:flat;wireframe:true'},g);
    halo(g,r*2.1,color,0.15); return g; }
  // ---- stadsramen-textuur (gecachet) ----
  const CITY_T={};
  function cityTex(h){ const k=Math.round(h/40); if(CITY_T[k]) return CITY_T[k];
    const cv=document.createElement('canvas'); cv.width=128; cv.height=256; const x=cv.getContext('2d');
    x.fillStyle='#04050a'; x.fillRect(0,0,128,256);
    for(let ry=4;ry<252;ry+=10){ for(let rx=4;rx<124;rx+=10){
      if(Math.random()<0.42){ x.fillStyle='hsla('+(h+Math.random()*40-20)+',80%,'+(50+Math.random()*25)+'%,'+(0.5+Math.random()*0.5)+')';
        x.fillRect(rx,ry,6,6); } } }
    const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; CITY_T[k]=t; return t; }
  AFRAME.registerComponent('btex',{ schema:{h:{default:300},rx:{default:1},ry:{default:2}},
    init:function(){ const el=this.el,d=this.data; const base=cityTex(d.h);
      const ap=function(){ const m=el.getObject3D('mesh'); if(m){ const t=base.clone(); t.needsUpdate=true; t.repeat.set(d.rx,d.ry); m.material.map=t; m.material.needsUpdate=true; } };
      el.addEventListener('object3dset',ap); if(el.getObject3D('mesh'))ap(); } });
  // ---- detail-textures: plaatjes op vormen (rots, panelen) ----
  const DTEX={};
  function detailTex(kind,hue){ const key=kind+'_'+Math.round(hue/30); if(DTEX[key]) return DTEX[key];
    const cv=document.createElement('canvas'); cv.width=256; cv.height=256; const x=cv.getContext('2d');
    if(kind==='panel'){ x.fillStyle='hsl('+hue+',12%,36%)'; x.fillRect(0,0,256,256);
      for(let py=0;py<4;py++) for(let px=0;px<4;px++){ x.fillStyle='hsl('+hue+',14%,'+(24+Math.random()*30)+'%)';
        x.fillRect(px*64+3,py*64+3,58,58); }
      x.strokeStyle='rgba(0,0,0,0.7)'; x.lineWidth=4;
      for(let g2=0;g2<=256;g2+=64){ x.beginPath(); x.moveTo(g2,0); x.lineTo(g2,256); x.stroke(); x.beginPath(); x.moveTo(0,g2); x.lineTo(256,g2); x.stroke(); }
      x.fillStyle='rgba(255,255,255,0.6)';

    (function poll(){ var l=document.getElementById('loader'); if(!l) return;
      var pct=0; if(window.SCENE_LOADED) pct=30;
      if(window.B_EXPECT>0) pct=Math.min(100, Math.round((window.SCENE_LOADED?30:0)+70*Math.min(1,window.B_DONE/window.B_EXPECT)));

      if(!window.SCENE_LOADED){ var secs=Math.round((Date.now()-window.T0)/1000);
        ph.textContent='scene laden… ('+secs+'s)';
        if(secs>=12) ph.textContent='scene laadt niet ('+secs+'s) — maak een foto van dit scherm'; }
      else if(window.B_EXPECT===0||window.B_DONE<window.B_EXPECT){ ph.textContent='wereld bouwen…'; }
      if(window.SCENE_LOADED && window.B_EXPECT>0 && window.B_DONE>=window.B_EXPECT){ l.style.display='none'; return; }
      setTimeout(poll,120); })();
  </script>

      window.addEventListener('load',function(){ try{

        if(sc.hasLoaded) window.SCENE_LOADED=true;
        else { sc.addEventListener('loaded',function(){ window.SCENE_LOADED=true; });
               sc.addEventListener('renderstart',function(){ window.SCENE_LOADED=true; }); }
        setSkyTex(nebulaTex([230,300])); tryTrack();
        for(let i2=0;i2<SCENES.length;i2++) ensureBuilt(i2);
        window.B_EXPECT+=120; GENS.push(bMega()); GENS.push(bLandmarks()); GENS.push(bDream());
