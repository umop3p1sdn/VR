  let TOTALT=0; SCENES.forEach(sc=>{ sc.t0=TOTALT; TOTALT+=sc.dur; });

  // =========================================================
  //  MUZIEK
  // =========================================================
  let A=null,MASTER=null,DUCK=null,DELAY=null,DRONE=null,LIM=null;
  let PLAY=[], PIDX=0, CUR=null, ANA=null, ANAD=null;
  const TRACK_URLS=['Music/Track.mp3','music/Track.mp3','Music/Track2.mp3','Music/Track1.mp3'];
  function AC(){ if(A) return A; A=new (window.AudioContext||window.webkitAudioContext)();
    MASTER=A.createGain(); MASTER.gain.value=0.5;
    LIM=A.createDynamicsCompressor();
    LIM.threshold.value=-10; LIM.knee.value=6; LIM.ratio.value=20;
    LIM.attack.value=0.002; LIM.release.value=0.25;
    const eindG=A.createGain(); eindG.gain.value=0.8;
    const MUUR=A.createWaveShaper();                    // kan wiskundig niet boven 0.92
    { const N=2048, crv=new Float32Array(N), K=1.4, T=Math.tanh(K);
      for(let i=0;i<N;i++){ const x=(i/(N-1))*2-1; crv[i]=0.92*Math.tanh(x*K)/T; }
      MUUR.curve=crv; MUUR.oversample='2x'; }
    MASTER.connect(MUUR);                               // muziek rechtstreeks: schieten drukt hem nooit meer weg
    LIM.connect(eindG); eindG.connect(MUUR); MUUR.connect(A.destination);
    DUCK=A.createGain(); DUCK.gain.value=1; DUCK.connect(MASTER);
    DELAY=A.createDelay(1.2); DELAY.delayTime.value=0.32;
    const fb=A.createGain(); fb.gain.value=0.42;
    const fl=A.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=3200;
    const dw=A.createGain(); dw.gain.value=0.5;
    DELAY.connect(fl).connect(fb).connect(DELAY); DELAY.connect(dw).connect(DUCK);
    return A; }
  function markFound(){ const el=$('#trkInfo'); if(!el) return;
    if(!PLAY.length){ el.setAttribute('value','searching music...'); el.setAttribute('color','#c08a5a'); return; }
    el.setAttribute('value',PLAY.length+' track'+(PLAY.length>1?'s':'')+': '+PLAY[0].name);
    el.setAttribute('color','#6ad1a0'); }
  function addTrack(url,name){
    for(let i=0;i<PLAY.length;i++) if(PLAY[i].url===url) return;
    PLAY.push({url:url,name:name||url.split('/').pop()});
    PLAY.sort(function(a,b){ return a.name.localeCompare(b.name,undefined,{numeric:true}); });
    try{ localStorage.setItem('diepetrip_music',
      JSON.stringify(PLAY.map(function(p){ return p.url; }))); }catch(e){}
    markFound(); }
  function tryTrack(){
    try{ const c9=JSON.parse(localStorage.getItem('diepetrip_music')||'[]');
      c9.forEach(function(u){ const a=new Audio(); a.src=u; a.preload='metadata';
        a.addEventListener('loadedmetadata',function(){ addTrack(u); },{once:true});
        a.addEventListener('error',function(){}); a.load(); }); }catch(e){}
    discover();
    TRACK_URLS.forEach(function(u){ const a=new Audio(); a.src=u; a.preload='metadata';
      a.addEventListener('loadedmetadata',function(){ addTrack(u); },{once:true});
      a.addEventListener('error',function(){}); a.load(); }); }
  // leest de muziekmap uit via GitHub; repo-naam komt uit de URL
  function discover(){
    let owner=(location.hostname||'').split('.')[0]||'umop3p1sdn';
    let repo=(location.pathname||'/').split('/').filter(Boolean)[0]||'VR';
    if(/\.html?$/i.test(repo)) repo='VR';
    const repos=[repo,'VR','vr'], dirs=['Music','music',''], seen={};
    repos.forEach(function(rp){ dirs.forEach(function(dir){
      const key=rp+'|'+dir; if(seen[key]) return; seen[key]=1;
      fetch('https://api.github.com/repos/'+owner+'/'+rp+'/contents/'+dir)
        .then(function(r){ return r.ok?r.json():null; }).then(function(j){
        if(!j||!Array.isArray(j)) return;
        j.filter(function(x){ return /\.(mp3|m4a|wav|ogg)$/i.test(x.name||''); })
         .forEach(function(a){ addTrack((a.path||a.name).split('/').map(encodeURIComponent).join('/'),a.name); });
      }).catch(function(){});
    }); }); }
  let PROBING=false;
  setInterval(function(){ if(window.PHASE!=='menu'||PROBING) return;
    if(PLAY.length) return; PROBING=true; tryTrack();
    setTimeout(function(){ PROBING=false; },20000); },25000);
  // speelt de lijst op volgorde af en begint daarna weer bij de eerste
  function playAt(n){ if(!PLAY.length) return;
    PIDX=((n%PLAY.length)+PLAY.length)%PLAY.length;
    const item=PLAY[PIDX];
    if(CUR){ try{ CUR.pause(); }catch(e){} }
    if(!item.el){ item.el=new Audio(); item.el.src=item.url; item.el.preload='auto'; item.el.crossOrigin='anonymous';
      item.el.addEventListener('ended',function(){ playAt(PIDX+1); });
      try{ item.src=A.createMediaElementSource(item.el); item.src.connect(ANA); }catch(e){} }
    CUR=item.el;
    const nx=PLAY[(PIDX+1)%PLAY.length];
    if(nx&&!nx.el&&PLAY.length>1){ nx.el=new Audio(); nx.el.src=nx.url; nx.el.preload='auto'; nx.el.crossOrigin='anonymous';
      nx.el.addEventListener('ended',function(){ playAt(PIDX+1); });
      try{ nx.src=A.createMediaElementSource(nx.el); nx.src.connect(ANA); }catch(e){}
      try{ nx.el.load(); }catch(e){} }
    try{ CUR.currentTime=0; }catch(e){}
    const p=CUR.play(); if(p&&p.catch) p.catch(function(){});
    const el=$('#trkInfo'); if(el) el.setAttribute('value',(PIDX+1)+'/'+PLAY.length+'  '+item.name); }
  function duckNow(t){ if(!DUCK)return; DUCK.gain.cancelScheduledValues(t);
    DUCK.gain.setValueAtTime(0.32,t); DUCK.gain.linearRampToValueAtTime(1.0,t+0.22); }
  function supersaw(f,t,dur,vol,dest,att,bright){ const a=AC(); const g=a.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+(att||0.02));
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    const fl=a.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=bright||2400;
    [-9,0,9].forEach(function(d){ const o=a.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.detune.value=d;
      o.connect(fl); o.start(t); o.stop(t+dur+0.05); });
    fl.connect(g).connect(dest||DUCK); }
  function note(f,t,dur,vol,type,dest,att){ const a=AC(); const o=a.createOscillator(); o.type=type||'sine'; o.frequency.value=f;
    const g=a.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+(att||0.02));
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(dest||DUCK); o.start(t); o.stop(t+dur+0.05); }
  function kickAt(t,vol){ const a=AC(); const o=a.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(36,t+0.11);
    const g=a.createGain(); g.gain.setValueAtTime(vol||0.85,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.18);
    o.connect(g).connect(MASTER); o.start(t); o.stop(t+0.22);
    const n=a.createBufferSource(); n.buffer=ruis(a,0.012,0); const hf=a.createBiquadFilter(); hf.type='highpass'; hf.frequency.value=3000;
    const ng=a.createGain(); ng.gain.value=(vol||0.85)*0.35; n.connect(hf).connect(ng).connect(MASTER); n.start(t);
    duckNow(t);
    const ms=Math.max(0,(t-a.currentTime)*1000); setTimeout(function(){ window.BEAT=1; },ms); }
  function hatAt(t,vol,open){ const a=AC(); const dur=open?0.12:0.035;
    const n=a.createBufferSource(); n.buffer=ruis(a,dur,open?1:2); const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=7500;
    const g=a.createGain(); g.gain.value=vol||0.12; n.connect(f).connect(g).connect(MASTER); n.start(t); }
  function acidAt(f,t){ const a=AC(); const o=a.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
    const flt=a.createBiquadFilter(); flt.type='lowpass'; flt.Q.value=14;
    flt.frequency.setValueAtTime(280,t); flt.frequency.exponentialRampToValueAtTime(2400,t+0.08); flt.frequency.exponentialRampToValueAtTime(340,t+0.22);
    const g=a.createGain(); g.gain.setValueAtTime(0.085,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.24);
    o.connect(flt).connect(g).connect(DUCK); o.start(t); o.stop(t+0.3); }
  function riser(){ const a=AC(); const t=a.currentTime; const len=Math.floor(a.sampleRate*2); const b=a.createBuffer(1,len,a.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(i/len);
    const n=a.createBufferSource(); n.buffer=b; const f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=2;
    f.frequency.setValueAtTime(200,t); f.frequency.exponentialRampToValueAtTime(4500,t+2);
    const g=a.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.2,t+1.6); g.gain.linearRampToValueAtTime(0,t+2.1);
    n.connect(f).connect(g).connect(MASTER); n.start(t); }
  // ---- shooter-geluid: hit != kapot, alles door een langzaam draaiende faser ----
  let SFX=null, SFXSEQ=0, SFXOUT=null;
  function sfxOut(){ if(SFXOUT) return SFXOUT; const a=AC();
    SFXOUT=a.createGain(); SFXOUT.gain.value=1.0;
    const comp=a.createDynamicsCompressor();
    comp.threshold.value=-12; comp.knee.value=6; comp.ratio.value=7;
    comp.attack.value=0.002; comp.release.value=0.18;
    SFXOUT.connect(comp); comp.connect(LIM||a.destination); return SFXOUT; }
  function initSFX(){ if(SFX) return SFX; const a=AC();
    // geen faser meer: die had een terugkoppellus die bij veel geluiden opslingerde
    const inG=a.createGain(); inG.gain.value=0.85;
    const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=9000; lp.Q.value=0.4;
    inG.connect(lp); lp.connect(sfxOut());
    SFX={in:inG}; return SFX; }
  let VOICES=null, VI=0, SHCURVE=null;
  function shCurve(){ if(SHCURVE) return SHCURVE;
    SHCURVE=new Float32Array(1024);
    for(let i=0;i<1024;i++){ const x=i/512-1; SHCURVE[i]=Math.tanh(x*6); }
    return SHCURVE; }
  function sfxBus(pan,t,echoAmt){ const a=AC(); initSFX();
    if(!VOICES){ VOICES=[];
      for(let i=0;i<10;i++){ const g=a.createGain(); g.gain.value=1;
        let out=g, p=null;
        if(a.createStereoPanner){ p=a.createStereoPanner(); g.connect(p); out=p; }
        out.connect(SFX.in);
        if(DELAY){ const e=a.createGain(); e.gain.value=0.07; out.connect(e); e.connect(DELAY); }

        t.setAttribute('value',L); t.setAttribute('align','center'); t.setAttribute('color','#e6d8ff');
        t.setAttribute('width','1.5'); t.setAttribute('position',px+' '+py+' -2.07');
        wrap.appendChild(t); } }
    const mk=function(px,label,kleur,fn){
      const p=document.createElement('a-plane');
      p.setAttribute('class','menu-btn'); p.setAttribute('position',px+' 0.82 -2.08');
      p.setAttribute('width','0.6'); p.setAttribute('height','0.22');

    mk(-0.45,'DEL','#3a1a2a',function(){ NAAM=NAAM.slice(0,-1); toonNaam(); });
    mk(0.45,'OK','#1f5a3a',function(){ rondAf(); });
  }
  function toonBord(lijst){
    const kol=function(a,van){ let t='';
      for(let i=van;i<van+10;i++){ const e=a[i];
        t+=(i+1)+'. '+(e?(e.n+'  '+e.s+(e.d?('  '+e.d):'')+(e.c?(' C'+e.c):'')):'-')+'\n'; } return t; };
    const l=$('#bdLinks'), r=$('#bdRechts');
    if(l) l.setAttribute('value',kol(lijst,0));
    if(r) r.setAttribute('value',kol(lijst,10));
    $('#namePanel').setAttribute('visible',false);
    $('#boardPanel').setAttribute('visible',true);
    window.NAMEDONE=true; }
  function rondAf(){
    if(window.NAMEDONE) return;
    const sc=$('#rig').components.shooter;
    const punten=sc?((sc.score||0)+(sc.totBonus||0)+(sc.bonus||0)):0;
    const M9=window.MOEILIJK||2, st9=(M9>=8)?'HARD':((M9>=4)?'MID':'EASY');
    toonBord(bewaarScore(NAAM,punten,st9,(sc&&sc.contN)|0)); }

  // knoppen aanwijzen met de controller-straal (werkt ook in VR)
  let KLIKT=0;
  function menuKlik(h){
    if(!h||!h.object3D) return;
    const nu=performance.now(); if(nu-KLIKT<250) return; KLIKT=nu;
    const o=new THREE.Vector3(), q=new THREE.Quaternion();
    h.object3D.getWorldPosition(o); h.object3D.getWorldQuaternion(q);
    const d=new THREE.Vector3(0,-0.7071,-0.7071).applyQuaternion(q).normalize();
    if(Math.abs(d.z)<0.002) return;
    let best=null, bt=1e9;
    const wp=new THREE.Vector3();
    document.querySelectorAll('.menu-btn').forEach(function(el){
      if(!el.object3D) return;
      let p=el.object3D, zicht=true;
      while(p){ if(p.visible===false){ zicht=false; break; } p=p.parent; }
      if(!zicht) return;
      const w=parseFloat(el.getAttribute('width'))||1, hh=parseFloat(el.getAttribute('height'))||1;
      el.object3D.getWorldPosition(wp);
      const t=(wp.z-o.z)/d.z; if(t<=0.1||t>=bt) return;
      const px=o.x+d.x*t, py=o.y+d.y*t;
      if(Math.abs(px-wp.x)<=w*0.6&&Math.abs(py-wp.y)<=hh*0.75){ bt=t; best=el; } });
    if(best) best.emit('click'); }

  // =========================================================
  //  START / EINDE
  // =========================================================
  function startTrip(){ if(window.PHASE!=='menu') return; AC();
    if(PLAY.length){ try{
      ANA=A.createAnalyser(); ANA.fftSize=256; ANAD=new Uint8Array(ANA.frequencyBinCount); ANA.connect(MASTER);
      playAt(0); window.USE_TRACK=true; }catch(e){ window.USE_TRACK=false; } }
    if(!window.USE_TRACK) startDrone();
    initSFX();
    const m=$('#menu'); if(m&&m.parentNode)m.parentNode.removeChild(m);
    document.querySelectorAll('.hand').forEach(function(h){ h.setAttribute('visible',true);
      const l=h.querySelector('.menu-laser'); if(l&&l.parentNode) l.parentNode.removeChild(l); });
    $('#reticle').setAttribute('visible',false);
    const sc0=$('#rig').components.shooter; if(sc0&&sc0.reset) sc0.reset();
    window.PHASE='les'; }
  function endTrip(){ if(window.PHASE!=='trip') return; window.PHASE='end';
    window.DEMO=false; window.AIM=null;
    const rg1=$('#rig'); if(rg1&&rg1.object3D) rg1.object3D.rotation.set(0,0,0);
    const ti0=document.querySelector('#introTitel'); if(ti0) ti0.setAttribute('value','');
    window.ENDOK=false; setTimeout(function(){ window.ENDOK=true; },5000);
    if(MASTER) MASTER.gain.linearRampToValueAtTime(0.12,A.currentTime+3);
    document.querySelectorAll('.hand').forEach(function(h){ h.setAttribute('visible',true);
      h.setAttribute('raycaster','objects: .menu-btn; far: 30');
      h.setAttribute('cursor','fuse: false; downEvents: triggerdown; upEvents: triggerup; rayOrigin: entity');
      if(!h.querySelector('.menu-laser')){
        const l=document.createElement('a-entity'); l.setAttribute('class','menu-laser');
        l.setAttribute('rotation','-45 0 0');
        l.setAttribute('line','start: 0 0 0; end: 0 0 -30; color: #ffd98a; opacity: 1');
        h.appendChild(l); } });
    setTimeout(function(){ document.querySelectorAll('.hand').forEach(function(h){
      const r=h.components&&h.components.raycaster; if(r&&r.refreshObjects) r.refreshObjects(); }); },300);
    $('#reticle').setAttribute('visible',true);
    const sc=$('#rig').components.shooter;
    if(sc&&sc.sluitCombo) sc.sluitCombo();
    const punten=sc?((sc.score||0)+(sc.totBonus||0)+(sc.bonus||0)):0;
    NAAM=''; window.NAMEDONE=false;
    bouwToetsen(); toonNaam();
    const ns=$('#nmScore'); if(ns) ns.setAttribute('value','SCORE  '+punten);
    const nd=$('#nmDetail');
    if(nd&&sc){ const h2=(sc.totHits||0)+(sc.hits||0), k2=(sc.totKlein||0)+(sc.klein||0),
        g2=(sc.totGroot||0)+(sc.groot||0), b2=(sc.totBonus||0)+(sc.bonus||0);
      nd.setAttribute('value','hits '+h2+'   small '+k2+'   large '+g2+
        '\ncombo bonus '+b2+'   best combo '+Math.max(sc.topCombo||0,sc.beste||0)+'x'); }
    $('#namePanel').setAttribute('visible',true); }
  </script>

    <script>
      window.addEventListener('load',function(){ try{
        var sc=document.querySelector('a-scene');
        if(sc.hasLoaded) window.SCENE_LOADED=true;
        else { sc.addEventListener('loaded',function(){ window.SCENE_LOADED=true; });
               sc.addEventListener('renderstart',function(){ window.SCENE_LOADED=true; }); }
        tryTrack();
        window.PRIMHAND=window.PRIMHAND||'leftHand';
        window.MOEILIJK=window.MOEILIJK||2;
        const kies=function(h){ window.PRIMHAND=h;
          const L=document.querySelector('#btnLinks'), R=document.querySelector('#btnRechts');
          if(L) L.setAttribute('material','color:'+(h==='leftHand'?'#5a1f7a':'#2a1442')+';opacity:0.97;transparent:true');
          if(R) R.setAttribute('material','color:'+(h==='rightHand'?'#5a1f7a':'#2a1442')+';opacity:0.97;transparent:true'); };
        document.querySelector('#btnLinks').addEventListener('click',function(){ kies('leftHand'); });
        document.querySelector('#btnRechts').addEventListener('click',function(){ kies('rightHand'); });
        window.MOEILIJK=window.MOEILIJK||2;
        const zwaar=function(m){ window.MOEILIJK=m;
          const ids=['#btnEasy','#btnMed','#btnHard'], w=[2,4,8];
          for(let i=0;i<3;i++){ const e=document.querySelector(ids[i]);
            if(e) e.setAttribute('material','color:'+(w[i]===m?'#1f5a3a':'#2a1442')+';opacity:0.97;transparent:true'); } };
        document.querySelector('#btnEasy').addEventListener('click',function(){ zwaar(2); });
        document.querySelector('#btnMed').addEventListener('click',function(){ zwaar(4); });
        document.querySelector('#btnHard').addEventListener('click',function(){ zwaar(8); });
        let wl9=null, wlWil=false;
        const wakeAan=function(){ wlWil=true;
          try{ if(typeof navigator!=='undefined'&&navigator.wakeLock&&!wl9){
            navigator.wakeLock.request('screen').then(function(l9){ wl9=l9;
              l9.addEventListener('release',function(){ wl9=null; }); }).catch(function(){}); } }catch(e9){} };
        document.addEventListener('visibilitychange',function(){
          if(document.visibilityState==='visible'&&wlWil&&!wl9) wakeAan(); });
        document.querySelector('#btnStart').addEventListener('click',function(){ window.DEMO=false; startTrip(); wakeAan(); });
        document.querySelector('#btnDemo').addEventListener('click',function(){
          window.DEMO=true; startTrip(); window.PHASE='trip'; wakeAan();
          const rg0=$('#rig'); if(rg0&&rg0.object3D) rg0.object3D.rotation.set(0,0,0);
          const sc9=$('#rig').components.shooter, sw9=$('#rig').components.shaderworld;
          if(sc9&&sw9){ sc9.cheatW={lvl:2,mode:'start'};
            sw9.scene=1; sw9.elapsed=99999; window.LEVELDONE=true; } });
        document.querySelector('#btnSkip').addEventListener('click',function(){
          const sc=document.querySelector('#rig').components.shooter;
          if(sc&&sc.lesKlaar) sc.lesKlaar(); });
        document.querySelector('#btnAgain').addEventListener('click',function(){ if(window.PHASE==='end'&&window.ENDOK&&window.NAMEDONE) location.reload(); });
        document.querySelector('#btnAgain2').addEventListener('click',function(){ if(window.PHASE==='end'&&window.ENDOK) location.reload(); });
        (function(){ try{
          if(typeof fetch!=='function') return;
          const urls=['https://basketball-30825-default-rtdb.europe-west1.firebasedatabase.app',
                      'https://basketball-30825-default-rtdb.firebaseio.com'];
          let i9=0;
          const toon=function(n){ if(typeof n!=='number') return;
            const e=document.querySelector('#playsTxt'); if(e) e.setAttribute('value','plays: '+n);
            const d=document.getElementById('playsDiv'); if(d) d.textContent='plays: '+n; };
          const tel=function(){ if(i9>=urls.length) return;
            fetch(urls[i9]+'/trip/plays.json',{method:'PUT',
              headers:{'Content-Type':'application/json'},
              body:'{".sv":{"increment":1}}'})
              .then(function(r){ if(!r.ok) throw 0; return r.json(); })
              .then(toon)
              .catch(function(){ i9++; tel(); }); };
          tel();
        }catch(e9){} })();
        document.querySelector('#chOpen').addEventListener('click',function(){
          $('#cheatKnop').setAttribute('visible',false);
          $('#cheatPaneel').setAttribute('visible',true); });
        for(let li=1;li<=17;li++)(function(li){
          document.querySelector('#chL'+li).addEventListener('click',function(){
            window.CHEATLVL=li;
            const e9=document.querySelector('#chLvlTxt');
            if(e9) e9.setAttribute('value','ronde: '+li); }); })(li);
        const chGa=function(mode){
          const sc9=$('#rig').components.shooter, sw9=$('#rig').components.shaderworld;
          if(!sc9||!sw9) return;
          $('#cheatPaneel').setAttribute('visible',false);
          $('#cheatKnop').setAttribute('visible',false);
          sc9.pz=0; window.PAUSED=false;
          const pt9=document.querySelector('#pauzeTxt'); if(pt9) pt9.setAttribute('value','');
          sc9.cheatW={lvl:(window.CHEATLVL||1),mode:mode};
          sw9.scene=(window.CHEATLVL||1)-1; sw9.elapsed=99999; window.LEVELDONE=true; };
        document.querySelector('#chW1').addEventListener('click',function(){ chGa('start'); });
        document.querySelector('#chWM').addEventListener('click',function(){ chGa('mid'); });
        document.querySelector('#chWB').addEventListener('click',function(){ chGa('baas'); });
        document.querySelector('#chWS').addEventListener('click',function(){ chGa('skulls'); });
        document.querySelector('#chX').addEventListener('click',function(){
          $('#cheatPaneel').setAttribute('visible',false);
          $('#cheatKnop').setAttribute('visible',true); });
        document.querySelector('#btnJa').addEventListener('click',function(){
          const sc=document.querySelector('#rig').components.shooter;
          if(sc&&!sc.verder()){ } });
        document.querySelector('#btnNee').addEventListener('click',function(){
          const p=document.querySelector('#overPanel'); if(p) p.setAttribute('visible',false);
          window.PAUSED=false; endTrip(); });
        ['#leftHand','#rightHand'].forEach(function(id){ var h=document.querySelector(id); if(!h) return;
          ['triggerdown','selectstart'].forEach(function(ev){ h.addEventListener(ev,function(){
            if(window.PHASE==='menu'||window.PHASE==='les'||window.PHASE==='end'||window.PAUSED) menuKlik(h); }); }); });

      }catch(e){ var el=document.getElementById('ldErr'); if(el) el.textContent+='FOUT: '+e.message+'\n'; } });
    </script>
