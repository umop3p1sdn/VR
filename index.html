<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>DIEPE TRIP</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <style>
    #loader{position:fixed;inset:0;background:#05040a;color:#d8b0ff;z-index:99999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;font-family:monospace;text-align:center;padding:20px}
    #ldErr{font-size:14px;color:#ff6a8a;max-width:90%;white-space:pre-wrap;margin-top:16px}
  </style>
  <script>
  // =========================================================
  //  DIEPE TRIP v61.2
  //  tunnel -> door de mond naar buiten -> zwarte leegte -> nieuwe tunnel
  //  drie soorten verschijningen, elk kort en anders
  //  duur = beide tracks (4:12 + 4:00)
  // =========================================================
  window.PHASE='menu'; window.BEAT=0; window.USE_TRACK=false;
  const $=q=>document.querySelector(q);
  const rand=(a,b)=>a+Math.random()*(b-a);
  const pick=a=>a[Math.floor(Math.random()*a.length)];

  // tun:1 = tunnel, 0 = zwarte leegte | ev: -1 geen, 0 dans, 1 poorten, 2 inhalen
  // hole:1 = de tunnel eindigt in een zwart gat waar je doorheen vliegt
  // ev: -1 geen | 0 dans-schijven | 1 poorten | 2 inhalen | 3 slang | 4 dans-ringen
  // wall: 0 geen, 1 vloer, 2 zijkanten, 3 alles | tex:[sterkte,print] = zelfde print op lagen -> moire
  const SCENES=[
    {n:'opening', dur:40, intro:1, sway:0, yaw:0, roll:0, back:0, ev:-1,orb:1, orbF:0,orbNear:0,dome:0.0, wall:0, tex:[0,0], md:[3,0,2], fold:[6,6],  wave:[0.3,0.6], sp:[5,9],  rip:0.04, white:0, light:1,
     A:[0.05,0.05,0.12],B:[0.50,0.50,0.90],D:[0.00,0.15,0.35], mus:{root:110.0,mode:[0,3,5,7,10],bpm:138,goa:1,bright:2000}},
    {n:'donker1', dur:32, sway:0, yaw:0, roll:0, back:0, ev:-1,orb:0, orbF:-1,orbNear:0,dome:0.0, wall:0, tex:[0,0], md:[0,3,4], fold:[6,6],  wave:[0.5,0.9], sp:[9,13], rip:0.10, white:0, light:1,
     A:[0.05,0.05,0.12],B:[0.55,0.55,0.90],D:[0.60,0.65,0.75], mus:{root:110.0,mode:[0,3,5,7,10],bpm:140,goa:1,bright:2200}},
    {n:'wandenZ', dur:30, sway:0, yaw:0, roll:0, back:0, ev:-1,orb:0, orbF:-1,orbNear:0,dome:0.12,wall:2, tex:[0,0], md:[4,3,4], fold:[8,8],  wave:[0.3,0.5], sp:[10,14],rip:0.08, white:0, light:0,
     A:[0.05,0.09,0.12],B:[0.40,0.65,0.80],D:[0.15,0.35,0.55], mus:{root:98.0,mode:[0,2,3,7,10],bpm:146,goa:1,acid:1,bright:2500}},
    {n:'bolbij',  dur:24, sway:6, yaw:0, roll:0, back:0, ev:-1,orb:1, orbF:-1,orbNear:1,dome:0.0, wall:0, tex:[0,0], md:[0,0,2], fold:[6,6],  wave:[0.5,0.9], sp:[7,11], rip:0.12, white:0, light:0,
     A:[0.12,0.04,0.10],B:[0.80,0.45,0.75],D:[0.40,0.20,0.75], mus:{root:98.0,mode:[0,2,3,7,10],bpm:146,goa:1,bright:2600}},
    {n:'moire1',  dur:24, sway:0, yaw:0, roll:0, back:0, ev:-1,orb:0, orbF:-1,orbNear:0,dome:0.10,wall:0, tex:[0.85,0],md:[3,3,3],fold:[6,6],  wave:[1.0,1.5], sp:[9,13], rip:0.06, white:0, light:0,
     A:[0.08,0.08,0.10],B:[0.60,0.60,0.70],D:[0.10,0.30,0.55], mus:{root:116.5,mode:[0,1,4,6,7,10],bpm:148,goa:1,bright:2700}},
    {n:'donker2', dur:22, pipe:1, sway:0, yaw:0, roll:0, back:0, ev:-1,orb:0, orbF:-1,orbNear:0,dome:0.0, wall:0, tex:[0,0], md:[3,0,4], fold:[6,6],  wave:[0.2,0.3], sp:[11,15],rip:0.12, white:0, light:1,
     A:[0.06,0.05,0.10],B:[0.60,0.50,0.85],D:[0.55,0.60,0.70], mus:{root:82.4,mode:[0,1,3,7,8],bpm:140,goa:1,bright:2200}},
    {n:'slang',   dur:24, sway:8, yaw:0, roll:0, back:0, ev:-1,orb:1, orbF:-1,orbNear:0,dome:0.25,wall:0, tex:[0,0], md:[4,4,1], fold:[7,7],  wave:[0.3,0.6], sp:[8,12], rip:0.08, white:0, light:0,
     A:[0.04,0.10,0.09],B:[0.35,0.70,0.60],D:[0.20,0.45,0.60], mus:{root:98.0,mode:[0,2,3,7,10],bpm:146,goa:1,bright:2500}},
    {n:'caleido', dur:26, lay:1, sway:12, yaw:0, roll:0, back:0, ev:-1,orb:0, orbF:-1,orbNear:0,dome:0.0, wall:0, tex:[0,0], md:[1,1,4], fold:[6,14], wave:[0.4,0.9], sp:[9,13], rip:0.07, white:0, light:0,
     A:[0.12,0.05,0.14],B:[0.80,0.50,0.70],D:[0.00,0.33,0.67], mus:{root:123.5,mode:[0,3,5,7,10],bpm:144,goa:1,acid:1,bright:2600}},
    {n:'finale',  dur:26, sway:0, yaw:360, roll:20, back:1, ev:-1,orb:1, orbF:-1,orbNear:1,dome:0.30,wall:0, tex:[0,0], md:[3,0,2], fold:[6,6],  wave:[0.5,0.9], sp:[14,30],rip:0.10, white:0, light:0,
     A:[0.30,0.28,0.24],B:[0.70,0.70,0.66],D:[0.00,0.06,0.12], mus:{root:174.6,mode:[0,2,4,5,7,9,11],bpm:150,goa:1,bright:3200}}
  ];
  let TOTALT=0; SCENES.forEach(sc=>{ sc.t0=TOTALT; TOTALT+=sc.dur; });

  // =========================================================
  //  MUZIEK
  // =========================================================
  let A=null,MASTER=null,DUCK=null,DELAY=null,DRONE=null;
  let PLAY=[], PIDX=0, CUR=null, ANA=null, ANAD=null;
  const TRACK_URLS=['Music/Track.mp3','music/Track.mp3','Music/Track2.mp3','Music/Track1.mp3'];
  function AC(){ if(A) return A; A=new (window.AudioContext||window.webkitAudioContext)();
    MASTER=A.createGain(); MASTER.gain.value=0.5; MASTER.connect(A.destination);
    DUCK=A.createGain(); DUCK.gain.value=1; DUCK.connect(MASTER);
    DELAY=A.createDelay(1.2); DELAY.delayTime.value=0.32;
    const fb=A.createGain(); fb.gain.value=0.42;
    const fl=A.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=3200;
    const dw=A.createGain(); dw.gain.value=0.5;
    DELAY.connect(fl).connect(fb).connect(DELAY); DELAY.connect(dw).connect(DUCK);
    return A; }
  function markFound(){ const el=$('#trkInfo'); if(!el) return;
    if(!PLAY.length){ el.setAttribute('value','muziek zoeken...'); el.setAttribute('color','#c08a5a'); return; }
    el.setAttribute('value',PLAY.length+' track'+(PLAY.length>1?'s':'')+': '+PLAY[0].name);
    el.setAttribute('color','#6ad1a0'); }
  function addTrack(url,name){
    for(let i=0;i<PLAY.length;i++) if(PLAY[i].url===url) return;
    PLAY.push({url:url,name:name||url.split('/').pop()});
    PLAY.sort(function(a,b){ return a.name.localeCompare(b.name,undefined,{numeric:true}); });
    markFound(); }
  function tryTrack(){ discover();
    TRACK_URLS.forEach(function(u){ const a=new Audio(); a.src=u; a.preload='metadata';
      a.addEventListener('loadedmetadata',function(){ addTrack(u); },{once:true});
      a.addEventListener('error',function(){}); a.load(); }); }
  // leest de muziekmap uit via GitHub; repo-naam komt uit de URL
  function discover(){
    let owner=(location.hostname||'').split('.')[0]||'umop3p1sdn';
    let repo=(location.pathname||'/').split('/').filter(Boolean)[0]||'VR';
    if(/\.html?$/i.test(repo)) repo='VR';
    const repos=[repo,'VR','vr'], dirs=['Music','music',''], seen={};
    repos.forEach(function(rp){ dirs.forEach(function(dir){
      const key=rp+'|'+dir; if(seen[key]) return; seen[key]=1;
      fetch('https://api.github.com/repos/'+owner+'/'+rp+'/contents/'+dir)
        .then(function(r){ return r.ok?r.json():null; }).then(function(j){
        if(!j||!Array.isArray(j)) return;
        j.filter(function(x){ return /\.(mp3|m4a|wav|ogg)$/i.test(x.name||''); })
         .forEach(function(a){ addTrack((a.path||a.name).split('/').map(encodeURIComponent).join('/'),a.name); });
      }).catch(function(){});
    }); }); }
  let PROBING=false;
  setInterval(function(){ if(window.PHASE!=='menu'||PROBING) return;
    if(PLAY.length) return; PROBING=true; tryTrack();
    setTimeout(function(){ PROBING=false; },4000); },6000);
  // speelt de lijst op volgorde af en begint daarna weer bij de eerste
  function playAt(n){ if(!PLAY.length) return;
    PIDX=((n%PLAY.length)+PLAY.length)%PLAY.length;
    const item=PLAY[PIDX];
    if(CUR){ try{ CUR.pause(); }catch(e){} }
    if(!item.el){ item.el=new Audio(); item.el.src=item.url; item.el.preload='auto'; item.el.crossOrigin='anonymous';
      item.el.addEventListener('ended',function(){ playAt(PIDX+1); });
      try{ item.src=A.createMediaElementSource(item.el); item.src.connect(ANA); }catch(e){} }
    CUR=item.el;
    const nx=PLAY[(PIDX+1)%PLAY.length];
    if(nx&&!nx.el&&PLAY.length>1){ nx.el=new Audio(); nx.el.src=nx.url; nx.el.preload='auto'; nx.el.crossOrigin='anonymous';
      nx.el.addEventListener('ended',function(){ playAt(PIDX+1); });
      try{ nx.src=A.createMediaElementSource(nx.el); nx.src.connect(ANA); }catch(e){}
      try{ nx.el.load(); }catch(e){} }
    try{ CUR.currentTime=0; }catch(e){}
    const p=CUR.play(); if(p&&p.catch) p.catch(function(){});
    const el=$('#trkInfo'); if(el) el.setAttribute('value',(PIDX+1)+'/'+PLAY.length+'  '+item.name); }
  function duckNow(t){ if(!DUCK)return; DUCK.gain.cancelScheduledValues(t);
    DUCK.gain.setValueAtTime(0.32,t); DUCK.gain.linearRampToValueAtTime(1.0,t+0.22); }
  function supersaw(f,t,dur,vol,dest,att,bright){ const a=AC(); const g=a.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+(att||0.02));
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    const fl=a.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=bright||2400;
    [-9,0,9].forEach(function(d){ const o=a.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.detune.value=d;
      o.connect(fl); o.start(t); o.stop(t+dur+0.05); });
    fl.connect(g).connect(dest||DUCK); }
  function note(f,t,dur,vol,type,dest,att){ const a=AC(); const o=a.createOscillator(); o.type=type||'sine'; o.frequency.value=f;
    const g=a.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+(att||0.02));
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(dest||DUCK); o.start(t); o.stop(t+dur+0.05); }
  function kickAt(t,vol){ const a=AC(); const o=a.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(36,t+0.11);
    const g=a.createGain(); g.gain.setValueAtTime(vol||0.85,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.18);
    o.connect(g).connect(MASTER); o.start(t); o.stop(t+0.22);
    const len=Math.floor(a.sampleRate*0.012); const b=a.createBuffer(1,len,a.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const n=a.createBufferSource(); n.buffer=b; const hf=a.createBiquadFilter(); hf.type='highpass'; hf.frequency.value=3000;
    const ng=a.createGain(); ng.gain.value=(vol||0.85)*0.35; n.connect(hf).connect(ng).connect(MASTER); n.start(t);
    duckNow(t);
    const ms=Math.max(0,(t-a.currentTime)*1000); setTimeout(function(){ window.BEAT=1; },ms); }
  function hatAt(t,vol,open){ const a=AC(); const dur=open?0.12:0.035;
    const len=Math.floor(a.sampleRate*dur); const b=a.createBuffer(1,len,a.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,open?1.2:2);
    const n=a.createBufferSource(); n.buffer=b; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=7500;
    const g=a.createGain(); g.gain.value=vol||0.12; n.connect(f).connect(g).connect(MASTER); n.start(t); }
  function acidAt(f,t){ const a=AC(); const o=a.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
    const flt=a.createBiquadFilter(); flt.type='lowpass'; flt.Q.value=14;
    flt.frequency.setValueAtTime(280,t); flt.frequency.exponentialRampToValueAtTime(2400,t+0.08); flt.frequency.exponentialRampToValueAtTime(340,t+0.22);
    const g=a.createGain(); g.gain.setValueAtTime(0.085,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.24);
    o.connect(flt).connect(g).connect(DUCK); o.start(t); o.stop(t+0.3); }
  function riser(){ const a=AC(); const t=a.currentTime; const len=Math.floor(a.sampleRate*2); const b=a.createBuffer(1,len,a.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(i/len);
    const n=a.createBufferSource(); n.buffer=b; const f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=2;
    f.frequency.setValueAtTime(200,t); f.frequency.exponentialRampToValueAtTime(4500,t+2);
    const g=a.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.2,t+1.6); g.gain.linearRampToValueAtTime(0,t+2.1);
    n.connect(f).connect(g).connect(MASTER); n.start(t); }
  // ---- shooter-geluid: hit != kapot, alles door een langzaam draaiende faser ----
  let SFX=null, SFXSEQ=0, SFXOUT=null;
  function sfxOut(){ if(SFXOUT) return SFXOUT; const a=AC();
    SFXOUT=a.createGain(); SFXOUT.gain.value=1.35;
    const comp=a.createDynamicsCompressor();
    comp.threshold.value=-12; comp.knee.value=6; comp.ratio.value=7;
    comp.attack.value=0.002; comp.release.value=0.18;
    SFXOUT.connect(comp); comp.connect(a.destination); return SFXOUT; }
  function initSFX(){ if(SFX) return SFX; const a=AC();
    const inG=a.createGain(); inG.gain.value=0.9;
    const dry=a.createGain(); dry.gain.value=0.45;
    const wet=a.createGain(); wet.gain.value=0.8;
    const aps=[340,560,940,1500].map(function(f0){ const ap=a.createBiquadFilter();
      ap.type='allpass'; ap.frequency.value=f0; ap.Q.value=0.7; return ap; });
    inG.connect(aps[0]); aps[0].connect(aps[1]); aps[1].connect(aps[2]); aps[2].connect(aps[3]);
    const fb=a.createGain(); fb.gain.value=0.35; aps[3].connect(fb); fb.connect(aps[0]);
    inG.connect(dry); aps[3].connect(wet); dry.connect(sfxOut()); wet.connect(sfxOut());
    const lfo=a.createOscillator(); lfo.frequency.value=0.21;
    const lg=a.createGain(); lg.gain.value=430; lfo.connect(lg);
    aps.forEach(function(ap){ lg.connect(ap.frequency); }); lfo.start();
    SFX={in:inG}; return SFX; }
  function sfxBus(pan,t,echoAmt){ const a=AC(); initSFX();
    const g=a.createGain(); let out=g, p=null;
    if(a.createStereoPanner){ p=a.createStereoPanner();
      p.pan.setValueAtTime(Math.max(-1,Math.min(1,pan||0)),t); g.connect(p); out=p; }
    out.connect(SFX.in);
    if(echoAmt&&DELAY){ const e=a.createGain(); e.gain.value=echoAmt; out.connect(e); e.connect(DELAY);
      setTimeout(function(){ try{ e.disconnect(); }catch(x){} },2500); }
    setTimeout(function(){ try{ g.disconnect(); if(p)p.disconnect(); }catch(x){} },2500);
    return g; }
  function gunSnd(pan){ const a=AC(); const t=a.currentTime;
    const pn=a.createStereoPanner?a.createStereoPanner():null;
    const dest=pn||sfxOut(); if(pn){ pn.pan.value=Math.max(-1,Math.min(1,pan||0)); pn.connect(sfxOut());
      setTimeout(function(){ try{ pn.disconnect(); }catch(x){} },400); }
    const o=a.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(46,t+0.07);
    const g=a.createGain(); g.gain.setValueAtTime(1.8,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.13);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t+0.1);
    const len=Math.floor(a.sampleRate*0.05); const b=a.createBuffer(1,len,a.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.5);
    const n=a.createBufferSource(); n.buffer=b;
    const fl=a.createBiquadFilter(); fl.type='bandpass'; fl.Q.value=0.9;
    fl.frequency.setValueAtTime(2600,t); fl.frequency.exponentialRampToValueAtTime(320,t+0.09);
    const sh=a.createWaveShaper(); const cv=new Float32Array(1024);
    for(let i=0;i<1024;i++){ const x=i/512-1; cv[i]=Math.tanh(x*6); } sh.curve=cv;
    const ng=a.createGain(); ng.gain.value=1.9;
    n.connect(fl); fl.connect(sh); sh.connect(ng); ng.connect(dest); n.start(t);
    const cl=a.createBufferSource(); const clen=Math.floor(a.sampleRate*0.006);
    const cb=a.createBuffer(1,clen,a.sampleRate); const cd=cb.getChannelData(0);
    for(let i=0;i<clen;i++) cd[i]=(Math.random()*2-1)*(1-i/clen);
    cl.buffer=cb; const cg=a.createGain(); cg.gain.value=1.1; cl.connect(cg); cg.connect(dest); cl.start(t);
    const z=a.createOscillator(); z.type='sawtooth';
    z.frequency.setValueAtTime(900,t); z.frequency.exponentialRampToValueAtTime(70,t+0.1);
    const zg=a.createGain(); zg.gain.setValueAtTime(0.95,t); zg.gain.exponentialRampToValueAtTime(0.01,t+0.13);
    z.connect(zg); zg.connect(dest); z.start(t); z.stop(t+0.14); }
  function hitSnd(pan,prog){ const a=AC(); const t=a.currentTime; SFXSEQ++;
    const pv=1+0.06*Math.sin(SFXSEQ*1.31);
    const bus=sfxBus(pan,t,0.12);
    bus.gain.setValueAtTime(1.1,t); bus.gain.exponentialRampToValueAtTime(0.01,t+0.24);
    const o=a.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime((140+80*prog)*pv,t); o.frequency.exponentialRampToValueAtTime(60*pv,t+0.2);
    o.connect(bus); o.start(t); o.stop(t+0.24); }
  function killSnd(pan,size,t0){ const a=AC(); const t=t0||a.currentTime; SFXSEQ++;
    const pv=1+0.07*Math.sin(SFXSEQ*1.31);
    const bus=sfxBus(pan,t,0.18);
    bus.gain.setValueAtTime(1.5,t); bus.gain.exponentialRampToValueAtTime(0.01,t+0.3);
    const len=Math.floor(a.sampleRate*0.1); const b=a.createBuffer(1,len,a.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.6);
    const n=a.createBufferSource(); n.buffer=b; n.playbackRate.value=pv;
    const fl=a.createBiquadFilter(); fl.type='highpass'; fl.frequency.value=1600;
    n.connect(fl); fl.connect(bus); n.start(t);
    if(size>=1.8){ const o=a.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(95,t); o.frequency.exponentialRampToValueAtTime(38,t+0.16);
      const g=a.createGain(); g.gain.setValueAtTime(1.2,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.26);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t+0.22); } }
  function boomSnd(pan){ const a=AC(); const t=a.currentTime;
    const bus=sfxBus(pan,t,0.55);
    bus.gain.setValueAtTime(2.6,t); bus.gain.exponentialRampToValueAtTime(0.01,t+0.8);
    const len=Math.floor(a.sampleRate*0.5); const b=a.createBuffer(1,len,a.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.2);
    const n=a.createBufferSource(); n.buffer=b;
    const fl=a.createBiquadFilter(); fl.type='bandpass'; fl.Q.value=1.1;
    fl.frequency.setValueAtTime(1700,t); fl.frequency.exponentialRampToValueAtTime(160,t+0.5);
    n.connect(fl); fl.connect(bus); n.start(t);
    const o=a.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(75,t); o.frequency.exponentialRampToValueAtTime(32,t+0.3);
    const g=a.createGain(); g.gain.setValueAtTime(2.0,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.5);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t+0.45); }
  function startDrone(){ const a=AC(); if(DRONE) return;

            if(dd2>150&&dd2<bd2){ bd2=dd2; best=T[i]; } }
          if(best) R.zoek=best; }
        if(R.zoek&&R.zoek.c.alive){ const g2=R.zoek.p.clone().sub(R.m.position).normalize();
          R.dir.lerp(g2,Math.min(1,s*2.2)).normalize(); R.o.copy(R.m.position); R.d=0; }
        R.m.position.copy(R.o).addScaledVector(R.dir,R.d);
        if(R.swarm){ R.ph+=s*3.4; const w2=R.swarm*Math.min(1,R.d*0.05);
          R.m.position.x+=Math.cos(R.ph)*w2; R.m.position.y+=Math.sin(R.ph)*w2; }
        R.m.rotation.z+=s*8;
        let boom=(R.d>150);
        const p=R.m.position;
        if(!boom){ for(let a=0;a<this.groups.length&&!boom;a++){ const G=this.groups[a];
            for(let b=0;b<G.cubes.length;b++){ const c=G.cubes[b];
              if(c.alive&&c.m.position.distanceToSquared(p)<6){ boom=true; break; } } } }
        if(!boom&&this.bosses.length){ const BB=this.bosses[0]; for(let k=0;k<BB.cells.length;k++){ const c=BB.cells[k];
            if(c.alive&&c.wx!==undefined){ const dx=c.wx-p.x,dy=c.wy-p.y,dz=c.wz-p.z;
              if(dx*dx+dy*dy+dz*dz<6){ boom=true; break; } } } }
        if(boom){ R.live=false; R.m.visible=false;
          this.burst(p.x,p.y,p.z,this.bcol.setHex(0xffa040),26,34);
          this.fireBlast(p,10.2); boomSnd(p.x/9);
          window.SHOOTFLASH=Math.max(window.SHOOTFLASH||0,0.65); } }
      // doorlopende straal
      for(let i=0;i<this.zaps.length;i++){ const Z=this.zaps[i];
        if(Z.life>0){ Z.life-=s; if(Z.life<=0) Z.m.visible=false; } }
      for(const k in this.wep){ const W=this.wep[k]; if(W.cool>0) W.cool-=s; }
      this.bossTick(s);
      if(this.blastLife>0&&this.bosses.length) this.bossDamage(this.blast.position.x,this.blast.position.y,
        this.blast.position.z,this.blast.scale.x,10);
      for(let g=0;g<this.imesh.length;g++){ if(!this.idirty[g]) continue;
        this.imesh[g].instanceMatrix.needsUpdate=true;
        if(this.imesh[g].instanceColor) this.imesh[g].instanceColor.needsUpdate=true;
        this.idirty[g]=false; }
      const dbg=document.querySelector('#dbgTxt');
      if(dbg){ let w='';
        for(const k in this.wep){ const W=this.wep[k];
          if(W.t>0) w+='  '+this.WNAME[W.t]+' '+W.ammo; }
        dbg.setAttribute('value','level '+this.level+'   golf '+this.wave+'/'+this.waves+'   knal '+this.expl+w); }
      }catch(e){ this.dead=true; window.SHOOTDEAD=true; window.onerror('SHOOTER-TICK: '+e.message,'',0,0); } }
  });

  // =========================================================
  //  START / EINDE
  // =========================================================
  function startTrip(){ if(window.PHASE!=='menu') return; AC();
    if(PLAY.length){ try{
      ANA=A.createAnalyser(); ANA.fftSize=256; ANAD=new Uint8Array(ANA.frequencyBinCount); ANA.connect(MASTER);
      playAt(0); window.USE_TRACK=true; }catch(e){ window.USE_TRACK=false; } }
    if(!window.USE_TRACK) startDrone();
    initSFX();
    const m=$('#menu'); if(m&&m.parentNode)m.parentNode.removeChild(m);
    document.querySelectorAll('.hand').forEach(function(h){ h.setAttribute('visible',true);
      const l=h.querySelector('.menu-laser'); if(l&&l.parentNode) l.parentNode.removeChild(l); });
    $('#reticle').setAttribute('visible',false);
    window.PHASE='trip'; }
  function endTrip(){ if(window.PHASE!=='trip') return; window.PHASE='end';
    window.ENDOK=false; setTimeout(function(){ window.ENDOK=true; },5000);
    if(MASTER) MASTER.gain.linearRampToValueAtTime(0.12,A.currentTime+3);
    document.querySelectorAll('.hand').forEach(function(h){ h.setAttribute('visible',true);
      h.setAttribute('raycaster','objects: .menu-btn; far: 12; lineColor: #ffd98a; lineOpacity: 0.8'); });
    $('#reticle').setAttribute('visible',true);
    const st=$('#scoreTxt'); const sc=$('#rig').components.shooter;
    if(st&&sc) st.setAttribute('value','score  '+sc.score);
    $('#endscreen').setAttribute('visible',true); }
  </script>
</head>
<body>
  <div id="loader"><div style="font-size:22px;letter-spacing:4px">DIEPE TRIP</div>
    <div style="font-size:16px;color:#5ad0ff;margin-top:6px">v61.2</div>
    <div id="ldPhase" style="font-size:15px;color:#8a7aa8;margin-top:10px">laden…</div><div id="ldErr"></div></div>
  <script>
    window.SCENE_LOADED=false; window.T0=Date.now();
    window.onerror=function(msg,src,line,col){ var e=document.getElementById('ldErr');
      if(e) e.textContent+='FOUT: '+msg+' @ '+line+':'+col+'\n';
      var t=document.querySelector('#errTxt');
      if(t) t.setAttribute('value',String(msg).slice(0,70)+' @'+line);
      return false; };
    (function poll(){ var l=document.getElementById('loader'); if(!l) return;
      if(window.SCENE_LOADED){ l.style.display='none'; return; }
      var secs=Math.round((Date.now()-window.T0)/1000);
      if(secs>=12) document.getElementById('ldPhase').textContent='laadt niet ('+secs+'s) — maak een foto van dit scherm';
      setTimeout(poll,150); })();
  </script>
  <a-scene loading-screen="enabled: false" renderer="colorManagement: true; antialias: true; foveationLevel: 1"
           background="color: #000000">
    <a-entity id="rig" position="0 0 0" shaderworld shooter>
      <a-entity id="menu">
        <a-plane position="0 1.55 -2.1" width="1.9" height="1.15" material="color:#0a0714;opacity:0.93;transparent:true"></a-plane>
        <a-plane position="0 1.55 -2.11" width="1.98" height="1.23" material="color:#b04aff;opacity:0.16;transparent:true"></a-plane>
        <a-text value="DIEPE TRIP" align="center" color="#d8b0ff" width="4.2" position="0 1.95 -2.08"></a-text>
        <a-text value="Zet je geluid aan." align="center" color="#7c8794" width="1.6" position="0 1.63 -2.08"></a-text>
        <a-text id="trkInfo" value="tracks zoeken..." align="center" color="#7c8794" width="1.5" position="0 1.52 -2.08"></a-text>
        <a-plane id="btnStart" class="menu-btn" position="0 1.3 -2.08" width="1.3" height="0.34" material="color:#5a1f7a;opacity:0.97;transparent:true"></a-plane>
        <a-text value="START" align="center" color="#fff" width="3.4" position="0 1.3 -2.07"></a-text>
        <a-text value="v61.2" align="right" color="#5ad0ff" width="1.4" position="0.86 1.02 -2.07"></a-text>
      </a-entity>
      <a-entity id="endscreen" visible="false">
        <a-plane position="0 1.55 -2.1" width="1.9" height="1.05" material="color:#0a0714;opacity:0.95;transparent:true"></a-plane>
        <a-text value="EINDE" align="center" color="#ffd98a" width="5" position="0 1.85 -2.08"></a-text>
        <a-text id="scoreTxt" value="" align="center" color="#ffd98a" width="2.6" position="0 1.62 -2.08"></a-text>
        <a-plane id="btnAgain" class="menu-btn" position="0 1.32 -2.08" width="1.2" height="0.28" material="color:#5a1f7a;opacity:0.97;transparent:true"></a-plane>
        <a-text value="NOG EEN KEER" align="center" color="#fff" width="2.6" position="0 1.32 -2.07"></a-text>
      </a-entity>
      <a-camera wasd-controls-enabled="false" far="400">
        <a-entity id="reticle" cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .menu-btn"></a-entity>
        <a-text id="dbgTxt" value="" align="center" color="#4a5560" width="0.7" position="0 -0.62 -1.3"></a-text>
        <a-text id="errTxt" value="" align="center" color="#ff5a6a" width="1.0" position="0 -0.55 -1.3"></a-text>
        <a-plane id="flash" position="0 0 -0.32" width="2.6" height="2.6" material="color:#dfe8ff;opacity:0;transparent:true;shader:flat"></a-plane>
      </a-camera>
      <a-entity id="leftHand" class="hand" meta-touch-controls="hand: left" oculus-touch-controls="hand: left"
                raycaster="objects: .menu-btn; far: 60; direction: 0 -0.7071 -0.7071"
                cursor="fuse: false; downEvents: triggerdown; upEvents: triggerup; rayOrigin: entity">
        <a-entity class="menu-laser" rotation="-45 0 0" line="start: 0 0 0; end: 0 0 -60; color: #e8dcff; opacity: 1"></a-entity>
      </a-entity>
      <a-entity id="rightHand" class="hand" meta-touch-controls="hand: right" oculus-touch-controls="hand: right"
                raycaster="objects: .menu-btn; far: 60; direction: 0 -0.7071 -0.7071"
                cursor="fuse: false; downEvents: triggerdown; upEvents: triggerup; rayOrigin: entity">
        <a-entity class="menu-laser" rotation="-45 0 0" line="start: 0 0 0; end: 0 0 -60; color: #e8dcff; opacity: 1"></a-entity>
      </a-entity>
    </a-entity>
    <script>
      window.addEventListener('load',function(){ try{
        var sc=document.querySelector('a-scene');
        if(sc.hasLoaded) window.SCENE_LOADED=true;
        else { sc.addEventListener('loaded',function(){ window.SCENE_LOADED=true; });
               sc.addEventListener('renderstart',function(){ window.SCENE_LOADED=true; }); }
        tryTrack();
        document.querySelector('#btnStart').addEventListener('click',function(){ startTrip(); });
        document.querySelector('#btnAgain').addEventListener('click',function(){ if(window.PHASE==='end'&&window.ENDOK) location.reload(); });
        ['#leftHand','#rightHand'].forEach(function(id){ var h=document.querySelector(id); if(!h) return;
          ['triggerdown','selectstart'].forEach(function(ev){ h.addEventListener(ev,function(){
            if(window.PHASE==='menu') startTrip();
            else if(window.PHASE==='end'&&window.ENDOK) location.reload(); }); }); });

      }catch(e){ var el=document.getElementById('ldErr'); if(el) el.textContent+='FOUT: '+e.message+'\n'; } });
    </script>
  </a-scene>
</body>
</html>
