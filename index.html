<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>DIEPE TRIP</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script>
  // =========================================================
  //  DIEPE TRIP v3.0 — on-rails psychedelische reis (~5 min)
  // =========================================================
  window.PHASE='menu'; window.RIG=null; window.CAM=null;
  window.DIST=0; window.SPEED=0; window.SCENE=-1;

  // ---------- scenes: lengte (m), snelheid (m/s), sfeer, muziek ----------
  const SCENES=[
    {name:'ONTWAKEN',      len:105, sp:3.5,            bg:'#070510', fogD:0.028, mus:{root:110.0, mode:[0,3,5,7,10],   bpm:60,  kick:0, bright:900,  vol:1.0}},
    {name:'MANDALA',       len:240, sp:6,              bg:'#12061e', fogD:0.020, mus:{root:130.8, mode:[0,2,4,7,9],    bpm:84,  kick:0, bright:1400, vol:1.0}},
    {name:'SPIEGELS',      len:140, sp:4,              bg:'#04070c', fogD:0.030, mus:{root:98.0,  mode:[0,3,7,8,10],   bpm:70,  kick:0, bright:800,  vol:0.9}},
    {name:'STERRENVLUCHT', len:750, sp:30,             bg:'#020208', fogD:0.010, mus:{root:110.0, mode:[0,2,4,7,9],    bpm:132, kick:1, bright:2600, vol:1.1}},
    {name:'KRISTALWOUD',   len:200, sp:5,              bg:'#04101a', fogD:0.016, mus:{root:146.8, mode:[0,2,4,7,9,11], bpm:76,  kick:0, bright:1600, vol:1.0}},
    {name:'CHAOS',         len:420, sp:12,             bg:'#140410', fogD:0.018, mus:{root:116.5, mode:[0,1,4,6,7,10], bpm:120, kick:1, bright:2200, vol:1.1}},
    {name:'DE GROT',       len:135, sp:3,              bg:'#030204', fogD:0.05,  mus:{root:82.4,  mode:[0,1,3,6,8],    bpm:50,  kick:0, bright:500,  vol:0.9}},
    {name:'HET LICHT',     len:660, sp:18, spEnd:45,   bg:'#2a1a0a', fogD:0.008, mus:{root:174.6, mode:[0,2,4,5,7,9,11],bpm:100, kick:1, bright:3200, vol:1.1}}
  ];
  let TOTAL=0; SCENES.forEach(s=>{ s.z0=-TOTAL; TOTAL+=s.len; s.z1=-TOTAL; });

  const $=q=>document.querySelector(q);
  const rand=(a,b)=>a+Math.random()*(b-a);
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const hsl=(h,s,l)=>'hsl('+Math.round(h)+','+Math.round(s)+'%,'+Math.round(l)+'%)';

  // =========================================================
  //  MUZIEK — volledig gegenereerd (drone, pad, arpeggio, bas, kick, echo)
  // =========================================================
  let A=null, MASTER=null, DELAY=null, DRONE=null;
  function AC(){ if(A) return A; A=new (window.AudioContext||window.webkitAudioContext)();
    MASTER=A.createGain(); MASTER.gain.value=0.5; MASTER.connect(A.destination);
    DELAY=A.createDelay(1.2); DELAY.delayTime.value=0.375;
    const fb=A.createGain(); fb.gain.value=0.38; const dw=A.createGain(); dw.gain.value=0.5;
    DELAY.connect(fb).connect(DELAY); DELAY.connect(dw).connect(MASTER);
    return A; }
  function note(f,t,dur,vol,type,dest,att){ const a=AC(); const o=a.createOscillator(); o.type=type||'sine'; o.frequency.value=f;
    const g=a.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+(att||0.02));
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(dest||MASTER); o.start(t); o.stop(t+dur+0.05); }
  function kickAt(t){ const a=AC(); const o=a.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(38,t+0.12);
    const g=a.createGain(); g.gain.setValueAtTime(0.8,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.16);
    o.connect(g).connect(MASTER); o.start(t); o.stop(t+0.2); }
  function hatAt(t){ const a=AC(); const len=Math.floor(a.sampleRate*0.04); const b=a.createBuffer(1,len,a.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const n=a.createBufferSource(); n.buffer=b; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=6000;
    const g=a.createGain(); g.gain.value=0.16; n.connect(f).connect(g).connect(MASTER); n.start(t); }
  function riser(){ const a=AC(); const t=a.currentTime; const len=Math.floor(a.sampleRate*2); const b=a.createBuffer(1,len,a.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(i/len);
    const n=a.createBufferSource(); n.buffer=b; const f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=2;
    f.frequency.setValueAtTime(200,t); f.frequency.exponentialRampToValueAtTime(4000,t+2);
    const g=a.createGain(); g.gain.setValueAtTime(0.0,t); g.gain.linearRampToValueAtTime(0.22,t+1.6); g.gain.linearRampToValueAtTime(0,t+2.1);
    n.connect(f).connect(g).connect(MASTER); n.start(t); }
  function startDrone(){ const a=AC(); if(DRONE) return;
    const o1=a.createOscillator(); o1.type='sawtooth'; const o2=a.createOscillator(); o2.type='sawtooth'; o2.detune.value=8;
    const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=500;
    const lfo=a.createOscillator(); lfo.frequency.value=0.07; const lg=a.createGain(); lg.gain.value=260; lfo.connect(lg).connect(f.frequency); lfo.start();
    const g=a.createGain(); g.gain.value=0.055;
    o1.connect(f); o2.connect(f); f.connect(g).connect(MASTER); o1.start(); o2.start();
    DRONE={o1:o1,o2:o2,f:f}; }
  const MUS={cfg:null, nextT:0, step:0};
  function setMusic(cfg){ const a=AC(); MUS.cfg=cfg; MUS.step=0;
    if(DRONE){ DRONE.o1.frequency.linearRampToValueAtTime(cfg.root/2, a.currentTime+2.5);
      DRONE.o2.frequency.linearRampToValueAtTime(cfg.root/2*1.005, a.currentTime+2.5);
      DRONE.f.frequency.linearRampToValueAtTime(Math.max(300,cfg.bright*0.4), a.currentTime+2.5); } }
  function musTick(){ if(!A||!MUS.cfg||window.PHASE!=='trip') return; const a=A, c=MUS.cfg;
    const stepDur=60/c.bpm/2; // 8e noten
    if(MUS.nextT<a.currentTime) MUS.nextT=a.currentTime+0.05;
    while(MUS.nextT<a.currentTime+0.3){
      const t=MUS.nextT, i=MUS.step, deg=c.mode;
      if(i%16===0){ // pad-akkoord (2 maten)
        [0,2,4].forEach((di,k)=>{ const sem=deg[di%deg.length]+(di>=deg.length?12:0);
          note(c.root*Math.pow(2,sem/12),t,4.2,0.10-k*0.02,'triangle',MASTER,1.4); }); }
      if(i%8===0) note(c.root/2,t,1.6,0.16,'sine',MASTER,0.05); // bas
      if(c.kick && i%2===0) kickAt(t);
      if(c.kick && i%2===1) hatAt(t);
      if(Math.random()<0.5){ const sem=pick(deg)+12*(1+Math.floor(Math.random()*2));
        note(c.root*Math.pow(2,sem/12),t,0.5,0.10*c.vol,'sine',DELAY,0.01); }
      MUS.nextT+=stepDur; MUS.step++;
    } }
  setInterval(musTick,90);

  // =========================================================
  //  BOUWSTENEN — alles emissive/flat, spotgoedkoop
  // =========================================================
  const W_=()=>$('#world');
  function E(tag,attrs,parent){ const e=document.createElement(tag); for(const k in attrs) e.setAttribute(k,attrs[k]); (parent||W_()).appendChild(e); return e; }
  function glow(color,extra){ return 'color:'+color+';emissive:'+color+';emissiveIntensity:1.4;shader:flat'+(extra||''); }

  AFRAME.registerComponent('spin',{ schema:{x:{default:0},y:{default:0},z:{default:0}},
    tick:function(t,dt){ const s=(dt||16)/1000,o=this.el.object3D; o.rotation.x+=this.data.x*s; o.rotation.y+=this.data.y*s; o.rotation.z+=this.data.z*s; } });
  AFRAME.registerComponent('pulse',{ schema:{amp:{default:0.15},sp:{default:1},ph:{default:0}},
    tick:function(t){ const k=1+Math.sin(t/1000*this.data.sp+this.data.ph)*this.data.amp; this.el.object3D.scale.set(k,k,k); } });
  AFRAME.registerComponent('lookat-cam',{ tick:function(){ if(!window.CAM)return; const v=new THREE.Vector3(); window.CAM.object3D.getWorldPosition(v); this.el.object3D.lookAt(v); } });
  AFRAME.registerComponent('sway',{ schema:{amp:{default:0.3},sp:{default:0.7},ph:{default:0}},
    tick:function(t){ this.el.object3D.rotation.z=Math.sin(t/1000*this.data.sp+this.data.ph)*this.data.amp; } });

  // plek rond de baan; nooit in het gezicht (min. straal vanaf as)
  function around(z,rMin,rMax,yMin,yMax){ const a=Math.random()*Math.PI*2; const r=rand(rMin,rMax);
    return {x:Math.cos(a)*r, y:rand(yMin,yMax), z:z, a:a}; }

  // ---------- scene-bouwers (generators: bouwen gespreid over frames) ----------
  function* bOntwaken(z0,z1){ for(let z=z0;z>z1;z-=7){
      for(let k=0;k<3;k++){ const p=around(z-rand(0,6),2.4,9,-3,5);
        E('a-sphere',{radius:rand(0.15,0.5),position:p.x+' '+p.y+' '+p.z, material:glow(hsl(rand(200,290),80,65)), pulse:'amp:0.25; sp:'+rand(0.4,1)+'; ph:'+rand(0,6)}); }
      if(Math.random()<0.4) E('a-torus',{radius:rand(4,7),'radius-tubular':0.06,position:'0 1.6 '+(z-3),material:glow(hsl(rand(220,300),70,55)),spin:'z:'+rand(0.05,0.2)});
      if(Math.random()<0.5){ const p=around(z-2,0.9,1.6,1.1,2.2);
        E('a-sphere',{radius:0.07,position:p.x+' '+p.y+' '+p.z,material:glow('#bfe6ff')}); }
      yield; } }
  function* bMandala(z0,z1){ let hue=280;
    for(let z=z0;z>z1;z-=12){ hue=(hue+22)%360;
      const ring=E('a-entity',{position:'0 1.6 '+z, spin:'z:'+(Math.random()<0.5?1:-1)*rand(0.15,0.45)});
      for(let i=0;i<8;i++){ const a=i/8*Math.PI*2;
        E('a-cone',{position:(Math.cos(a)*3.4)+' '+(Math.sin(a)*3.4)+' 0',rotation:'0 0 '+(a*180/Math.PI-90),
          'radius-bottom':0.5,'radius-top':0.02,height:1.7,material:glow(hsl(hue+(i%2)*40,85,60))},ring); }
      for(let i=0;i<5;i++){ const a=i/5*Math.PI*2+0.5;
        E('a-sphere',{radius:0.28,position:(Math.cos(a)*2.0)+' '+(Math.sin(a)*2.0)+' 0',material:glow(hsl(hue+180,90,70))},ring); }
      E('a-torus',{radius:4.6,'radius-tubular':0.08,material:glow(hsl(hue,80,55))},ring);
      if(Math.random()<0.35) E('a-torus',{radius:13,'radius-tubular':0.4,position:'0 1.6 '+(z-6),material:glow(hsl(hue,70,40)),spin:'z:'+rand(0.03,0.08)});
      yield; } }
  function* bSpiegels(z0,z1){ for(let z=z0;z>z1;z-=10){
      for(const sx of [-1,1]){ const x=sx*rand(3,5.2); const fig=E('a-entity',{position:x+' 0 '+(z-rand(0,4)),rotation:'0 '+(sx<0?60:-60)+' 0'});
        E('a-box',{position:'0 1.05 0',width:0.42,height:1.15,depth:0.26,material:'color:#0c1016;metalness:1;roughness:0.05'},fig);
        E('a-sphere',{position:'0 1.85 0',radius:0.2,material:'color:#0e1218;metalness:1;roughness:0.05'},fig);
        E('a-sphere',{position:'0.07 1.88 0.16',radius:0.03,material:glow('#9fe8ff')},fig);
        E('a-sphere',{position:'-0.07 1.88 0.16',radius:0.03,material:glow('#9fe8ff')},fig);
        E('a-box',{position:'0.3 1.1 0',width:0.12,height:0.9,depth:0.14,rotation:'0 0 -12',material:'color:#0c1016;metalness:1;roughness:0.05'},fig);
        E('a-box',{position:'-0.3 1.1 0',width:0.12,height:0.9,depth:0.14,rotation:'0 0 12',material:'color:#0c1016;metalness:1;roughness:0.05'},fig); }
      if(Math.random()<0.6){ const p=around(z-5,2.2,6,0,3.5);
        E('a-plane',{position:p.x+' '+p.y+' '+p.z,rotation:rand(-20,20)+' '+rand(0,360)+' '+rand(-20,20),width:rand(1,2.4),height:rand(1.6,3),
          material:'color:#dfe8f4;metalness:1;roughness:0.02;opacity:0.22;transparent:true;side:double',sway:'amp:0.12; sp:0.4; ph:'+rand(0,6)}); }
      yield; } }
  function* bSterren(z0,z1){ for(let z=z0;z>z1;z-=5){
      for(let k=0;k<2;k++){ const p=around(z,2.4,9,-4,7);
        E('a-box',{position:p.x+' '+p.y+' '+p.z,width:0.05,height:0.05,depth:rand(6,18),
          material:glow(pick(['#bfe6ff','#8affd9','#ff9af0','#fff']))}); }
      if(Math.random()<0.12) E('a-torus',{radius:rand(4.5,6),'radius-tubular':0.12,position:'0 1.6 '+z,material:glow(pick(['#2affc9','#ff2ad0','#5ad0ff'])),spin:'z:'+rand(0.4,1.2)});
      if(Math.random()<0.5){ const p=around(z,1.0,1.8,0.8,2.4);
        E('a-sphere',{radius:0.05,position:p.x+' '+p.y+' '+p.z,material:glow('#ffffff')}); }
      yield; } }
  function* bKristal(z0,z1){ for(let z=z0;z>z1;z-=12){
      for(let k=0;k<2;k++){ const p=around(z-rand(0,8),13,36,-24,-4);
        E('a-cone',{position:p.x+' '+p.y+' '+p.z,'radius-bottom':rand(3,7),'radius-top':0.3,height:rand(16,42),rotation:rand(-12,12)+' 0 '+rand(-12,12),
          material:glow(pick(['#2affc9','#7a5aff','#5ad0ff','#b28aff']))+';opacity:0.85;transparent:true'}); }
      if(Math.random()<0.7){ const p=around(z,10,26,8,22);
        E('a-cone',{position:p.x+' '+p.y+' '+p.z,'radius-bottom':rand(2,5),'radius-top':0.2,height:rand(10,26),rotation:'180 0 '+rand(-15,15),
          material:glow(pick(['#2affc9','#7a5aff','#5ad0ff']))+';opacity:0.8;transparent:true'}); }
      for(let k=0;k<2;k++){ const p=around(z-rand(0,10),1.4,3.2,0.4,3);
        E('a-octahedron',{radius:rand(0.15,0.4),position:p.x+' '+p.y+' '+p.z,material:glow('#aef2ff'),spin:'x:'+rand(0.5,1.5)+'; y:'+rand(0.5,1.5)}); }
      yield; } }
  function* bChaos(z0,z1){ for(let z=z0;z>z1;z-=8){
      const sw=E('a-entity',{position:'0 1.6 '+z,spin:'z:'+(Math.random()<0.5?1:-1)*rand(0.8,2.2)+'; y:'+rand(-0.5,0.5)});
      for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; const r=rand(2.4,6);
        E(pick(['a-box','a-tetrahedron','a-octahedron']),{position:(Math.cos(a)*r)+' '+(Math.sin(a)*r)+' 0',
          width:0.5,height:0.5,depth:0.5,radius:0.35,material:glow(hsl(rand(0,360),95,60)),pulse:'amp:0.4; sp:'+rand(2,5)+'; ph:'+rand(0,6)},sw); }
      if(Math.random()<0.3) E('a-box',{position:'0 1.6 '+(z-2),width:rand(8,14),height:rand(8,14),depth:0.2,rotation:'0 0 '+rand(0,90),
        material:'color:'+hsl(rand(0,360),90,55)+';shader:flat;wireframe:true',spin:'z:'+rand(0.2,0.8)});
      yield; } }
  function* bGrot(z0,z1){ for(let z=z0;z>z1;z-=6){
      for(const sx of [-1,1]) E('a-cone',{position:(sx*rand(8,14))+' '+rand(-4,2)+' '+z,'radius-bottom':rand(5,9),'radius-top':rand(1,3),height:rand(14,22),material:'color:#0b0810;shader:flat'});
      E('a-cone',{position:rand(-6,6)+' '+rand(7,10)+' '+z,'radius-bottom':rand(1,2.5),'radius-top':0.05,height:rand(3,6),rotation:'180 0 0',material:'color:#0d0a12;shader:flat'});
      for(let k=0;k<5;k++){ const p=around(z-rand(0,5),2,9,-2,6);
        E('a-sphere',{radius:rand(0.04,0.1),position:p.x+' '+p.y+' '+p.z,material:glow(pick(['#3affc9','#5a8aff','#b04aff'])),pulse:'amp:0.5; sp:'+rand(0.5,1.4)+'; ph:'+rand(0,6)}); }
      yield; }
    const N=3; for(let i=0;i<N;i++){ const zz=z0+((z1-z0)*(i+0.5)/N); const sx=(i%2===0)?-1:1; const big=(i===N-1)?2.6:1;
      const wez=E('a-entity',{position:(sx*rand(5,7))+' 0 '+zz,rotation:'0 '+(sx<0?70:-70)+' 0'});
      E('a-cylinder',{position:'0 '+(2.2*big)+' 0',radius:0.35*big,height:4.4*big,material:'color:#160a1a;shader:flat'},wez);
      for(let t2=0;t2<5;t2++){ const a=t2/5*Math.PI*2;
        E('a-cone',{position:(Math.cos(a)*0.5*big)+' '+(0.6*big)+' '+(Math.sin(a)*0.5*big),'radius-bottom':0.16*big,'radius-top':0.01,height:1.6*big,rotation:(rand(-30,30))+' 0 '+(rand(-40,40)),material:'color:#1c0e22;shader:flat',sway:'amp:0.25; sp:'+rand(0.4,0.9)+'; ph:'+rand(0,6)},wez); }
      const kop=E('a-entity',{position:'0 '+(4.6*big)+' 0'},wez);
      E('a-sphere',{radius:0.55*big,material:'color:#1a0c20;shader:flat'},kop);
      const oog=E('a-entity',{position:'0 0 0','lookat-cam':''},kop);
      E('a-sphere',{radius:0.34*big,position:'0 0 0.28',material:glow('#e8d8ff')+';emissiveIntensity:0.9'},oog);
      E('a-sphere',{radius:0.15*big,position:'0 0 '+(0.28+0.24*big*0.6),material:'color:#12041a;shader:flat'},oog);
      for(let e2=0;e2<4;e2++){ const p=around(0,0.8*big,1.2*big,3.2*big,4.2*big);
        E('a-sphere',{radius:0.08*big,position:p.x+' '+p.y+' '+p.z,material:glow('#b04aff'),pulse:'amp:0.4; sp:1; ph:'+rand(0,6)},wez); }
      yield; } }
  function* bLicht(z0,z1){ let g=0;
    for(let z=z0;z>z1;z-=8){ g++;
      if(g%2===0) E('a-torus',{radius:rand(4,6.5),'radius-tubular':0.1,position:'0 1.6 '+z,material:glow(pick(['#ffd98a','#fff0c0','#ffb35a'])),spin:'z:'+rand(0.2,0.6)});
      for(let k=0;k<2;k++){ const p=around(z,2.6,9,-3,6);
        E('a-box',{position:p.x+' '+p.y+' '+p.z,width:0.06,height:0.06,depth:rand(5,14),material:glow('#fff2d0')}); }
      if(Math.random()<0.4){ const p=around(z,3,8,-2,5);
        E('a-sphere',{radius:rand(0.2,0.5),position:p.x+' '+p.y+' '+p.z,material:glow('#ffe2a0'),pulse:'amp:0.3; sp:'+rand(0.8,1.6)+'; ph:'+rand(0,6)}); }
      yield; } }
  const BUILDERS=[bOntwaken,bMandala,bSpiegels,bSterren,bKristal,bChaos,bGrot,bLicht];

  // gespreide bouw: een paar stapjes per frame, nooit blokkeren
  const BUILT=[], GENS=[];
  function ensureBuilt(i){ if(i<0||i>=SCENES.length||BUILT[i])return; BUILT[i]=true; GENS.push(BUILDERS[i](SCENES[i].z0,SCENES[i].z1)); }
  setInterval(function(){ if(!window.RIG)return; let n=0;
    while(GENS.length&&n<8){ try{ if(GENS[0].next().done) GENS.shift(); }catch(e){ GENS.shift(); } n++; } },17);

  // =========================================================
  //  TIJDLIJN — beweging, scene-wissels, kleuren, opruimen
  // =========================================================
  const bgFrom=new THREE.Color('#070510'), bgTo=new THREE.Color('#070510'), bgCur=new THREE.Color('#070510');
  let bgLerp=1, fogFrom=0.028, fogTo=0.028, fogCur=0.028, reapT=0;
  AFRAME.registerComponent('timeline',{
    tick:function(t,dt){ if(window.PHASE!=='trip') return; const s=(dt||16)/1000;
      // scene bepalen
      let idx=SCENES.length-1;
      for(let i=0;i<SCENES.length;i++){ if(window.DIST < -SCENES[i].z1){ idx=i; break; } }
      const SC=SCENES[idx];
      if(idx!==window.SCENE){ window.SCENE=idx; this.enter(SC); }
      ensureBuilt(idx+1); ensureBuilt(idx+2);
      // snelheid (met ramp binnen laatste scene)
      let target=SC.sp;
      if(SC.spEnd){ const pr=(window.DIST-(-SC.z0))/SC.len; target=SC.sp+(SC.spEnd-SC.sp)*Math.min(1,Math.max(0,pr)); }
      window.SPEED+= (target-window.SPEED)*Math.min(1,s/1.6);
      window.DIST+=window.SPEED*s;
      window.RIG.object3D.position.z=-window.DIST;
      // kleuren zacht overvloeien
      if(bgLerp<1){ bgLerp=Math.min(1,bgLerp+s/3); bgCur.copy(bgFrom).lerp(bgTo,bgLerp);
        fogCur=fogFrom+(fogTo-fogFrom)*bgLerp;
        const sc=this.el; sc.setAttribute('background','color: #'+bgCur.getHexString());
        sc.setAttribute('fog','type: exponential; color: #'+bgCur.getHexString()+'; density: '+fogCur.toFixed(4)); }
      // opruimen achter je
      reapT+=s; if(reapT>2){ reapT=0; const cz=window.RIG.object3D.position.z;
        const w=W_(); const kids=w.children;
        for(let i=kids.length-1;i>=0;i--){ const k=kids[i]; if(k.object3D && k.object3D.position.z > cz+20) w.removeChild(k); } }
      // einde
      if(window.DIST>=TOTAL-1){ endTrip(); } },
    enter:function(SC){ riser(); setMusic(SC.mus);
      bgFrom.copy(bgCur); bgTo.set(SC.bg); fogFrom=fogCur; fogTo=SC.fogD; bgLerp=0;
      const b=$('#banner'); b.setAttribute('value',SC.name); b.setAttribute('visible',true);
      b.object3D.userData.t0=performance.now();
      clearTimeout(this._bt); this._bt=setTimeout(function(){ b.setAttribute('visible',false); },3500); }
  });

  // =========================================================
  //  START / EINDE
  // =========================================================
  function startTrip(){ if(window.PHASE!=='menu') return; AC(); startDrone();
    const m=$('#menu'); if(m&&m.parentNode)m.parentNode.removeChild(m);
    // handen volledig weg tijdens de trip
    document.querySelectorAll('.hand').forEach(function(h){ h.removeAttribute('cursor'); h.removeAttribute('raycaster');
      const l=h.querySelector('.menu-laser'); if(l&&l.parentNode)l.parentNode.removeChild(l); h.setAttribute('visible',false); });
    $('#reticle').setAttribute('visible',false);
    window.PHASE='trip'; window.DIST=0; window.SPEED=SCENES[0].sp*0.4; window.SCENE=-1; }
  function endTrip(){ if(window.PHASE!=='trip') return; window.PHASE='end';
    if(MASTER){ MASTER.gain.linearRampToValueAtTime(0.12, A.currentTime+3); }
    // handen terug voor de herstartknop
    document.querySelectorAll('.hand').forEach(function(h){ h.setAttribute('visible',true);
      h.setAttribute('raycaster','objects: .menu-btn; far: 12');
      h.setAttribute('cursor','fuse: false; downEvents: triggerdown; upEvents: triggerup; rayOrigin: entity');
      const l=document.createElement('a-entity'); l.setAttribute('class','menu-laser');
      l.setAttribute('line','start: 0 0 0; end: 0 0 -12; color: #ffd98a; opacity: 0.5'); h.appendChild(l); });
    $('#reticle').setAttribute('visible',true);
    $('#endscreen').setAttribute('visible',true); }
  </script>
</head>
<body>
  <a-scene timeline loading-screen="dotsColor: #b04aff; backgroundColor: #070510" renderer="colorManagement: true; antialias: true; foveationLevel: 1"
           background="color: #070510" fog="type: exponential; color: #070510; density: 0.028">
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.0"></a-entity>
    <a-entity id="world"></a-entity>

    <a-entity id="rig" position="0 0 0">
      <!-- MENU -->
      <a-entity id="menu">
        <a-plane position="0 1.55 -2.1" width="1.9" height="1.15" material="color:#0a0714;opacity:0.93;transparent:true"></a-plane>
        <a-plane position="0 1.55 -2.11" width="1.98" height="1.23" material="color:#b04aff;opacity:0.16;transparent:true"></a-plane>
        <a-text value="DIEPE TRIP" align="center" color="#d8b0ff" width="4.2" position="0 1.95 -2.08"></a-text>
        <a-text value="Een reis van vijf minuten. Kijk om je heen." align="center" color="#9aa8c0" width="1.8" position="0 1.74 -2.08"></a-text>
        <a-text value="Zet je geluid aan." align="center" color="#7c8794" width="1.6" position="0 1.6 -2.08"></a-text>
        <a-plane id="btnStart" class="menu-btn" position="0 1.32 -2.08" width="1.0" height="0.26" material="color:#5a1f7a;opacity:0.97;transparent:true"></a-plane>
        <a-text value="START" align="center" color="#fff" width="3" position="0 1.32 -2.07"></a-text>
        <a-text value="v3.1" align="right" color="#5ad0ff" width="1.4" position="0.86 1.08 -2.07"></a-text>
      </a-entity>

      <!-- EINDE -->
      <a-entity id="endscreen" visible="false">
        <a-plane position="0 1.55 -2.1" width="1.9" height="1.05" material="color:#0a0714;opacity:0.95;transparent:true"></a-plane>
        <a-text value="EINDE" align="center" color="#ffd98a" width="5" position="0 1.85 -2.08"></a-text>
        <a-text value="Welkom terug." align="center" color="#9aa8c0" width="1.8" position="0 1.62 -2.08"></a-text>
        <a-plane id="btnAgain" class="menu-btn" position="0 1.34 -2.08" width="1.1" height="0.24" material="color:#5a1f7a;opacity:0.97;transparent:true"></a-plane>
        <a-text value="NOG EEN KEER" align="center" color="#fff" width="2.6" position="0 1.34 -2.07"></a-text>
      </a-entity>

      <a-camera wasd-controls-enabled="false" far="150">
        <a-cursor id="reticle" color="#d8b0ff" fuse="false" raycaster="objects: .menu-btn"></a-cursor>
        <a-text id="banner" value="" visible="false" align="center" color="#ffffff" width="3.4" position="0 0.62 -2.2"></a-text>
      </a-camera>

      <a-entity id="leftHand" class="hand" meta-touch-controls="hand: left"
                raycaster="objects: .menu-btn; far: 12"
                cursor="fuse: false; downEvents: triggerdown; upEvents: triggerup; rayOrigin: entity">
        <a-entity class="menu-laser" line="start: 0 0 0; end: 0 0 -12; color: #d8b0ff; opacity: 0.5"></a-entity>
      </a-entity>
      <a-entity id="rightHand" class="hand" meta-touch-controls="hand: right"
                raycaster="objects: .menu-btn; far: 12"
                cursor="fuse: false; downEvents: triggerdown; upEvents: triggerup; rayOrigin: entity">
        <a-entity class="menu-laser" line="start: 0 0 0; end: 0 0 -12; color: #d8b0ff; opacity: 0.5"></a-entity>
      </a-entity>
    </a-entity>

    <script>
      window.addEventListener('load',function(){
        window.RIG=document.querySelector('#rig'); window.CAM=document.querySelector('a-camera');
        ensureBuilt(0); ensureBuilt(1);
        document.querySelector('#btnStart').addEventListener('click',function(){ startTrip(); });
        document.querySelector('#btnAgain').addEventListener('click',function(){ location.reload(); });
      });
    </script>
  </a-scene>
</body>
</html>
