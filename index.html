<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Dead Passage — VR Rail Shooter</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
  <script>
  window.STARTED=false; window.PHASE='menu'; window.GUN_HAND='left';
  window.HEALTH=100; window.LEVEL=0; window.NODE=0;
  window.NODE_SPAWNED=0; window.NODE_KILLS=0; window.NODE_QUOTA=0;
  window.SPEEDMULT=1; window.CORRIDOR_W=5; window.RIG=null;
  window.ZOMBIES=[]; window.STATS={head:0,body:0,levelStart:0,totalHead:0,totalBody:0};

  // ---------- pistool ----------
  const GUN_FB = `
    <a-box position="0 0.02 -0.08" width="0.05" height="0.06" depth="0.26" material="color:#3a3f47;metalness:0.85;roughness:0.28"></a-box>
    <a-box position="0 0.055 -0.09" width="0.048" height="0.02" depth="0.24" material="color:#23272e;metalness:0.9;roughness:0.22"></a-box>
    <a-box position="0 -0.008 -0.1" width="0.05" height="0.03" depth="0.24" material="color:#1b1e23;metalness:0.7;roughness:0.4"></a-box>
    <a-cylinder position="0 0.02 -0.225" radius="0.016" height="0.04" rotation="90 0 0" material="color:#0a0a0a;metalness:0.95;roughness:0.15"></a-cylinder>
    <a-box position="0 0.075 -0.19" width="0.008" height="0.014" depth="0.008" material="color:#e8f4ff;emissive:#bfe6ff;emissiveIntensity:0.9"></a-box>
    <a-box position="0 0.075 0.02" width="0.02" height="0.014" depth="0.008" material="color:#e8f4ff;emissive:#bfe6ff;emissiveIntensity:0.7"></a-box>
    <a-box position="0 -0.1 0.03" width="0.048" height="0.15" depth="0.06" rotation="20 0 0" material="color:#20232a;metalness:0.3;roughness:0.75"></a-box>
    <a-box position="0 -0.178 0.05" width="0.05" height="0.03" depth="0.066" rotation="20 0 0" material="color:#12141a;metalness:0.4;roughness:0.7"></a-box>
    <a-torus position="0 -0.055 -0.02" radius="0.032" radius-tubular="0.006" arc="230" rotation="90 0 0" material="color:#20232a;metalness:0.6;roughness:0.4"></a-torus>`;
  const GUN_MODEL_HTML = `
    <a-entity id="gunVisual" gltf-fallback="src: models/gun.glb; fb: gun; scale: 0.2 0.2 0.2; rot: 0 0 0"></a-entity>
    <a-entity id="aimGroup" position="0 0.02 0" rotation="0 0 0">
      <a-cylinder position="0 0 -15" radius="0.005" height="30" rotation="90 0 0" material="color:#45e0ff;emissive:#45e0ff;emissiveIntensity:1;transparent:true;opacity:0.7;shader:flat"></a-cylinder>
    </a-entity>
    <a-entity id="muzzleFlash" visible="false" position="0 0.02 -0.26">
      <a-sphere radius="0.05" material="color:#ffd27a;emissive:#ffb44a;emissiveIntensity:2"></a-sphere>
      <a-light type="point" color="#ffb44a" intensity="2" distance="6"></a-light>
    </a-entity>`;
  function buildGun(h){ h.innerHTML=GUN_MODEL_HTML; h.setAttribute('gun',''); }
  function updateHandUI(){
    const l=document.querySelector('#btnLeft'), r=document.querySelector('#btnRight');
    if(l) l.setAttribute('material','color:'+(window.GUN_HAND==='left'?'#2a6f4a':'#1d2230')+';opacity:0.95;transparent:true');
    if(r) r.setAttribute('material','color:'+(window.GUN_HAND==='right'?'#2a6f4a':'#1d2230')+';opacity:0.95;transparent:true');
  }

  // ---------- audio ----------
  let ACTX=null;
  function ensureAudio(){ if(!ACTX) ACTX=new (window.AudioContext||window.webkitAudioContext)(); }
  function bang(){ try{ ensureAudio(); const t=ACTX.currentTime; const len=Math.floor(ACTX.sampleRate*0.22);
    const buf=ACTX.createBuffer(1,len,ACTX.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
    const nz=ACTX.createBufferSource(); nz.buffer=buf; const lp=ACTX.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2200;
    const ng=ACTX.createGain(); ng.gain.setValueAtTime(0.9,t); ng.gain.exponentialRampToValueAtTime(0.01,t+0.2);
    nz.connect(lp).connect(ng).connect(ACTX.destination); nz.start(t);
    const o=ACTX.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(42,t+0.16);
    const og=ACTX.createGain(); og.gain.setValueAtTime(0.9,t); og.gain.exponentialRampToValueAtTime(0.01,t+0.2);
    o.connect(og).connect(ACTX.destination); o.start(t); o.stop(t+0.22);
  }catch(e){} }
  function moan(vol){ try{ ensureAudio(); const t=ACTX.currentTime;
    const o1=ACTX.createOscillator(); o1.type='sawtooth'; o1.frequency.setValueAtTime(65+Math.random()*30,t); o1.frequency.linearRampToValueAtTime(50+Math.random()*20,t+0.7);
    const o2=ACTX.createOscillator(); o2.type='sine'; o2.frequency.value=105+Math.random()*30;
    const lp=ACTX.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=650; lp.Q.value=7;
    const g=ACTX.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||0.2,t+0.15); g.gain.linearRampToValueAtTime(0,t+0.95+Math.random()*0.4);
    o1.connect(lp); o2.connect(lp); lp.connect(g).connect(ACTX.destination); o1.start(t); o2.start(t); o1.stop(t+1.5); o2.stop(t+1.5);
  }catch(e){} }
  function startAmbience(){ try{ ensureAudio();
    const o=ACTX.createOscillator(); o.type='sine'; o.frequency.value=47; const g=ACTX.createGain(); g.gain.value=0.05; o.connect(g).connect(ACTX.destination); o.start();
    const buf=ACTX.createBuffer(1,ACTX.sampleRate*2,ACTX.sampleRate); const dd=buf.getChannelData(0); for(let i=0;i<dd.length;i++) dd[i]=Math.random()*2-1;
    const n=ACTX.createBufferSource(); n.buffer=buf; n.loop=true; const nf=ACTX.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=320; nf.Q.value=0.5;
    const ng=ACTX.createGain(); ng.gain.value=0.02; n.connect(nf).connect(ng).connect(ACTX.destination); n.start();
    setInterval(function(){ if(window.PHASE!=='playing'||window.ZOMBIES.length===0) return; const min=nearestZombieDist(); const vol=Math.max(0.06,0.3*(1-Math.min(1,min/26))); if(Math.random()<0.85) moan(vol); },2600);
  }catch(e){} }

  function rigPos(){ return window.RIG ? window.RIG.object3D.position : {x:0,y:0,z:0}; }
  function nearestZombieDist(){ const rp=rigPos(); let m=99; for(let i=0;i<window.ZOMBIES.length;i++){ const p=window.ZOMBIES[i].object3D.position; const d=Math.hypot(p.x-rp.x,p.z-rp.z); if(d<m)m=d; } return m; }
  function addScore(n){ const el=document.querySelector('#scoreText'); if(!el)return; const cur=parseInt((el.getAttribute('value')||'').replace(/\D/g,''))||0; el.setAttribute('value','Kills: '+(cur+n)); }
  function registerKill(head){ if(head){STATS.head++;STATS.totalHead++;} else {STATS.body++;STATS.totalBody++;} window.NODE_KILLS++; addScore(1); }

  // ---------- effecten ----------
  function spawnBeam(a,b,color,radius,life){ const scene=document.querySelector('a-scene'); const mid=a.clone().add(b).multiplyScalar(0.5); const len=Math.max(0.1,a.distanceTo(b));
    const c=document.createElement('a-cylinder'); c.setAttribute('radius',radius); c.setAttribute('height',len); c.setAttribute('color',color);
    c.setAttribute('material','emissive:'+color+';emissiveIntensity:2;transparent:true;opacity:0.9;shader:flat'); c.setAttribute('position',mid.x+' '+mid.y+' '+mid.z);
    const dir=b.clone().sub(a).normalize(); const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
    c.addEventListener('loaded',function(){ c.object3D.quaternion.copy(q); }); scene.appendChild(c); setTimeout(function(){ if(c.parentNode)c.parentNode.removeChild(c); },life||70); }
  function blood(point,dir){ const scene=document.querySelector('a-scene'); const f=document.createElement('a-sphere'); f.setAttribute('radius',0.08);
    f.setAttribute('material','color:#a01010;emissive:#ff2020;emissiveIntensity:1.5;transparent:true;opacity:0.95;shader:flat'); f.setAttribute('position',point.x+' '+point.y+' '+point.z);
    scene.appendChild(f); setTimeout(function(){ if(f.parentNode)f.parentNode.removeChild(f); },130);
    for(let i=0;i<10;i++){ const dpl=document.createElement('a-sphere'); dpl.setAttribute('radius',0.02+Math.random()*0.02); dpl.setAttribute('color','#6e0d0d'); dpl.setAttribute('position',point.x+' '+point.y+' '+point.z);
      const v=new THREE.Vector3((Math.random()-.5)*2,1+Math.random()*2,(Math.random()-.5)*2); v.add(dir.clone().multiplyScalar(1.5));
      dpl.addEventListener('loaded',function(){ dpl.object3D.userData.launchVel=v; }); dpl.setAttribute('gib',''); scene.appendChild(dpl); } }
  function goreBurst(wp,n){ const scene=document.querySelector('a-scene'); for(let i=0;i<(n||10);i++){ const g=document.createElement('a-box'); const sz=0.05+Math.random()*0.1;
      g.setAttribute('width',sz); g.setAttribute('height',sz); g.setAttribute('depth',sz); g.setAttribute('color',Math.random()<0.5?'#6e0d0d':'#4a1d1d');
      g.setAttribute('position',wp.x+' '+(wp.y+0.4)+' '+wp.z); const v=new THREE.Vector3((Math.random()-.5)*3,2+Math.random()*2.5,(Math.random()-.5)*3);
      g.addEventListener('loaded',function(){ g.object3D.userData.launchVel=v; }); g.setAttribute('gib',''); scene.appendChild(g); } }
  function applySkyGradient(topCol,botCol){ const sky=document.querySelector('#sky'); if(!sky)return; const cv=document.createElement('canvas'); cv.width=16; cv.height=256;
    const ctx=cv.getContext('2d'); const g=ctx.createLinearGradient(0,0,0,256); g.addColorStop(0,topCol); g.addColorStop(1,botCol); ctx.fillStyle=g; ctx.fillRect(0,0,16,256);
    const tex=new THREE.CanvasTexture(cv); const ap=function(){ const m=sky.getObject3D('mesh'); if(m){ m.material.map=tex; m.material.color&&m.material.color.set('#ffffff'); m.material.needsUpdate=true; } };
    if(sky.getObject3D('mesh')) ap(); else sky.addEventListener('loaded',ap); }

  const PART={ head:{tag:'a-sphere',attrs:{radius:0.17},pos:'0 1.5 0',rot:'5 0 0',slot:'skin'},
    torso:{tag:'a-box',attrs:{depth:0.28,width:0.5,height:0.8},pos:'0 0.95 0',rot:'10 0 0',slot:'cloth'},
    armL:{tag:'a-box',attrs:{depth:0.4,width:0.16,height:0.13},pos:'-0.2 1.05 0.28',rot:'-70 0 0',slot:'skin'},
    armR:{tag:'a-box',attrs:{depth:0.4,width:0.16,height:0.13},pos:'0.2 1.05 0.28',rot:'-70 0 0',slot:'skin'},
    legL:{tag:'a-box',attrs:{depth:0.2,width:0.18,height:0.6},pos:'-0.12 0.3 0',rot:'0 0 0',slot:'pants'},
    legR:{tag:'a-box',attrs:{depth:0.2,width:0.18,height:0.6},pos:'0.12 0.3 0',rot:'0 0 0',slot:'pants'} };
  const SKINS=[{skin:'#5a6b4a',cloth:'#3c4a35',pants:'#2d3a28'},{skin:'#6b6356',cloth:'#43403a',pants:'#322f2a'},{skin:'#7d8a6c',cloth:'#4a5240',pants:'#363c2c'},{skin:'#8a8475',cloth:'#3a3f48',pants:'#2a2d33'}];
  const ARM_BASE=-1.221;
  var GLB_SRC='models/zombie.glb', GLB_SCALE=1.0, GLB_FACING=0;
  function findClip(cl,keys){ if(!cl)return null; for(var i=0;i<cl.length;i++){ var n=(cl[i].name||'').toLowerCase(); for(var k=0;k<keys.length;k++) if(n.indexOf(keys[k])>=0) return cl[i]; } return null; }
  function clearZombies(){ window.ZOMBIES.slice().forEach(function(z){ if(z.parentNode)z.parentNode.removeChild(z); }); window.ZOMBIES=[]; }

  const FB={ gun:GUN_FB,
    car:`<a-box position="0 0.35 0" width="0.95" height="0.45" depth="2.0" color="#7a2222"></a-box><a-box position="0 0.72 -0.1" width="0.85" height="0.4" depth="1.1" color="#7a2222"></a-box><a-cylinder position="0.5 0.22 0.6" radius="0.22" height="0.16" rotation="0 0 90" color="#111"></a-cylinder><a-cylinder position="-0.5 0.22 0.6" radius="0.22" height="0.16" rotation="0 0 90" color="#111"></a-cylinder><a-cylinder position="0.5 0.22 -0.6" radius="0.22" height="0.16" rotation="0 0 90" color="#111"></a-cylinder><a-cylinder position="-0.5 0.22 -0.6" radius="0.22" height="0.16" rotation="0 0 90" color="#111"></a-cylinder>`,
    barrel:`<a-cylinder position="0 0.45 0" radius="0.28" height="0.9" material="color:#3a342c;metalness:0.4;roughness:0.8"></a-cylinder>` };
  AFRAME.registerComponent('gltf-fallback',{ schema:{src:{default:''},scale:{default:'1 1 1'},rot:{default:'0 0 0'},fb:{default:''}},
    init:function(){ const el=this.el,d=this.data; let done=false; const self=this;
      el.addEventListener('model-loaded',function(){ done=true; el.setAttribute('scale',d.scale); el.setAttribute('rotation',d.rot); });
      el.addEventListener('model-error',function(){ if(!done) self.fb(); });
      if(d.src) el.setAttribute('gltf-model',d.src); else self.fb();
      setTimeout(function(){ if(!done && !el.getObject3D('mesh')) self.fb(); },4500); },
    fb:function(){ if(this.d)return; this.d=true; this.el.removeAttribute('gltf-model'); this.el.innerHTML=FB[this.data.fb]||''; } });

  AFRAME.registerComponent('dmg-flash',{ init:function(){this.o=0;}, hit:function(){this.o=0.45;},
    tick:function(t,dt){ if(this.o>0){ this.o=Math.max(0,this.o-(dt||16)/400); this.el.setAttribute('material','color:#ff0000;opacity:'+this.o+';transparent:true;shader:flat'); } } });
  AFRAME.registerComponent('flicker',{ schema:{base:{default:1}}, tick:function(){ this.el.setAttribute('light','intensity',this.data.base*(0.55+Math.random()*0.6)); } });
  AFRAME.registerComponent('gib',{ init:function(){ this.vel=this.el.object3D.userData.launchVel||new THREE.Vector3(0,1,0); this.spin=new THREE.Vector3((Math.random()-.5)*12,(Math.random()-.5)*12,(Math.random()-.5)*12); this.life=0; this.rest=false; },
    tick:function(t,dt){ const s=(dt||16)/1000,o=this.el.object3D; if(!this.rest){ this.vel.y-=9.8*s; o.position.addScaledVector(this.vel,s); o.rotation.x+=this.spin.x*s; o.rotation.y+=this.spin.y*s; o.rotation.z+=this.spin.z*s; if(o.position.y<=0.06){o.position.y=0.06;this.rest=true;} } this.life+=s; if(this.life>6&&this.el.parentNode) this.el.parentNode.removeChild(this.el); } });

  function damagePlayer(n){ if(window.PHASE!=='playing') return; window.HEALTH=Math.max(0,window.HEALTH-n); updateHealthUI(); const el=document.querySelector('#dmgFlash'); if(el&&el.components['dmg-flash'])el.components['dmg-flash'].hit(); if(window.HEALTH<=0) gameOver(); }
  function updateHealthUI(){ const fill=document.querySelector('#hpFill'); if(!fill)return; const fr=Math.max(0,window.HEALTH/100); fill.object3D.scale.x=Math.max(0.001,fr); fill.object3D.position.x=-0.29*(1-fr); fill.setAttribute('material','color:'+(fr>0.5?'#3bd16f':fr>0.25?'#e0b03a':'#e03a3a')+';shader:flat'); }
  function gameOver(){ if(window.PHASE==='gameover')return; window.PHASE='gameover'; clearZombies(); const go=document.querySelector('#gameover');
    const st=document.querySelector('#goStats'); if(st)st.setAttribute('value','Levels gehaald: '+window.LEVEL+'    Kills: '+(STATS.totalHead+STATS.totalBody));
    if(go)go.setAttribute('visible',true); armContinue(function(){ location.reload(); }); }

  // ---------- ZOMBIE ----------
  AFRAME.registerComponent('zombie',{
    init:function(){ this.dead=false; this.crawler=false; this.phase=Math.random()*6; this.glbMode=false; this.glbReady=false; this.built=false; this.dieTimer=0;
      var r=Math.random(),type='normal'; if(r<0.13)type='runner'; else if(r<0.25)type='brute'; else if(r<0.32)type='crawler'; this._type=type; this.runner=(type==='runner');
      var sk,sc;
      if(type==='runner'){this.speed=1.7+Math.random()*0.5; sk={skin:'#9a5a5a',cloth:'#5a2f2f',pants:'#412424'}; sc=0.85+Math.random()*0.15; this.torsoHP=2; this.touchDmg=26;}
      else if(type==='brute'){this.speed=0.55+Math.random()*0.2; sk={skin:'#6b7a55',cloth:'#3a4630',pants:'#2c3626'}; sc=1.35+Math.random()*0.2; this.torsoHP=6; this.touchDmg=34;}
      else if(type==='crawler'){this.speed=0.55+Math.random()*0.2; sk=SKINS[Math.floor(Math.random()*SKINS.length)]; sc=0.95+Math.random()*0.15; this.torsoHP=2; this.touchDmg=14; this.crawler=true; this.legs=0;}
      else {this.speed=0.9+Math.random()*0.45; sk=SKINS[Math.floor(Math.random()*SKINS.length)]; sc=0.9+Math.random()*0.2; this.torsoHP=3; this.touchDmg=16;}
      if(type!=='crawler') this.legs=2; this.speed*=(window.SPEEDMULT||1);
      this._sk=sk; this._sc=sc; this.knock=new THREE.Vector3(); this.fallAxis=(Math.random()<0.5)?'x':'z'; this.fallDir=(Math.random()<0.5)?1:-1; this.parts={};
      window.ZOMBIES.push(this.el); this.el.object3D.userData.zombieComp=this; var self=this;
      this.el.addEventListener('model-loaded',function(){ self.onGLB(); });
      this.el.addEventListener('model-error',function(){ self.buildPrimitive(); });
      this.el.setAttribute('gltf-model',GLB_SRC);
      setTimeout(function(){ if(!self.glbReady&&!self.built) self.buildPrimitive(); },4500); },
    onGLB:function(){ if(this.built)return; this.glbReady=true; this.glbMode=true;
      var ts=(this._type==='brute')?1.4:(this._type==='runner')?0.9:1; var sc=GLB_SCALE*ts; this._glbScale=sc; this.el.setAttribute('scale',sc+' '+sc+' '+sc);
      var gm=this.el.components['gltf-model']; var cl=(gm&&gm.model&&gm.model.animations)?gm.model.animations:[]; this.deathClip=findClip(cl,['death','die','dead','fall']);
      var walk=findClip(cl,['walk','run','move','crawl','zombie'])||(cl[0]||null); if(walk) this.el.setAttribute('animation-mixer','clip: '+walk.name+'; loop: repeat; timeScale: '+(0.7+this.speed*0.4).toFixed(2)); },
    buildPrimitive:function(){ if(this.built||this.glbReady)return; this.built=true; this.el.removeAttribute('gltf-model'); var self=this,sk=this._sk,type=this._type,sc=this._sc; this.el.setAttribute('scale',sc+' '+sc+' '+sc);
      Object.keys(PART).forEach(function(name){ if(self.crawler&&(name==='legL'||name==='legR'))return; var spec=PART[name]; var e=document.createElement(spec.tag);
        Object.keys(spec.attrs).forEach(function(k){ e.setAttribute(k,spec.attrs[k]); }); e.setAttribute('color',sk[spec.slot]); e.setAttribute('position',spec.pos); e.setAttribute('rotation',spec.rot);
        self.el.appendChild(e); self.parts[name]=e; e.setAttribute('shadow','cast: true'); e.addEventListener('loaded',function(){ e.object3D.userData.part=name; });
        if(name==='head'){ e.addEventListener('loaded',function(){ ['0.06 0.02 0.15','-0.06 0.02 0.15'].forEach(function(p){ var eye=document.createElement('a-sphere'); eye.setAttribute('radius',0.03); eye.setAttribute('position',p); eye.setAttribute('material','color:#ff2b2b;emissive:#ff2b2b;emissiveIntensity:'+(self.runner?1.7:1)+';shader:flat'); e.appendChild(eye); }); }); } });
      if(type==='brute'&&this.parts.torso) this.parts.torso.setAttribute('scale','1.45 1.1 1.35'); },
    spawnGib:function(name,dir){ var ref=this.parts[name]; if(!ref)return; var spec=PART[name]; var wp=new THREE.Vector3(); ref.object3D.getWorldPosition(wp);
      var g=document.createElement(spec.tag); Object.keys(spec.attrs).forEach(function(k){ g.setAttribute(k,spec.attrs[k]); }); g.setAttribute('color',ref.getAttribute('color')); g.setAttribute('position',wp.x+' '+wp.y+' '+wp.z);
      var v=new THREE.Vector3().copy(dir).setY(0).normalize().multiplyScalar(1+Math.random()*1.4); v.y=2.2+Math.random()*2; g.addEventListener('loaded',function(){ g.object3D.userData.launchVel=v; }); g.setAttribute('gib',''); this.el.sceneEl.appendChild(g); this.el.removeChild(ref); this.parts[name]=null; },
    hitPart:function(part,dir,point){ if(this.dead)return;
      if(this.glbMode){ var hy=1.45*(this._glbScale||1); if(point&&point.y>hy){ this.killGLB(dir,true); return; } this.torsoHP-=1; if(point) goreBurst(point,6); if(this.torsoHP<=0) this.killGLB(dir,false); return; }
      if(part==='head'){ this.spawnGib('head',dir); this.killP(dir,true); return; }
      if(part==='armL'||part==='armR'){ this.spawnGib(part,dir); return; }
      if(part==='legL'||part==='legR'){ this.spawnGib(part,dir); this.legs-=1; if(this.legs<=0){this.crawler=true;this.speed=0.3;} else this.speed*=0.55; return; }
      this.torsoHP-=1; var ref=this.parts.torso; if(ref){ var wp=new THREE.Vector3(); ref.object3D.getWorldPosition(wp); var ch=document.createElement('a-box'); ch.setAttribute('depth',0.12); ch.setAttribute('width',0.12); ch.setAttribute('height',0.12); ch.setAttribute('color','#5a2a2a'); ch.setAttribute('position',wp.x+' '+(wp.y+(Math.random()-.5)*0.4)+' '+wp.z); var v=new THREE.Vector3().copy(dir).setY(0).normalize().multiplyScalar(1.5+Math.random()); v.y=1.5+Math.random()*1.5; ch.addEventListener('loaded',function(){ ch.object3D.userData.launchVel=v; }); ch.setAttribute('gib',''); this.el.sceneEl.appendChild(ch); }
      if(this.torsoHP<=0) this.killP(dir,false); },
    killGLB:function(dir,head){ if(this.dead)return; this.dead=true; registerKill(head); var i=window.ZOMBIES.indexOf(this.el); if(i>-1)window.ZOMBIES.splice(i,1); var wp=new THREE.Vector3(); this.el.object3D.getWorldPosition(wp); goreBurst(wp,12); if(this.deathClip) this.el.setAttribute('animation-mixer','clip: '+this.deathClip.name+'; loop: once; clampWhenFinished: true'); this.dieTimer=0; },
    killP:function(dir,head){ if(this.dead)return; this.dead=true; registerKill(head); this.knock.copy(dir||new THREE.Vector3(0,0,1)).setY(0).normalize().multiplyScalar(2); var i=window.ZOMBIES.indexOf(this.el); if(i>-1)window.ZOMBIES.splice(i,1); },
    remove0:function(){ var i=window.ZOMBIES.indexOf(this.el); if(i>-1)window.ZOMBIES.splice(i,1); if(this.el.parentNode)this.el.parentNode.removeChild(this.el); },
    tick:function(time,dt){ if(window.PHASE==='gameover')return; var s=(dt||16)/1000,o=this.el.object3D; var rp=rigPos();
      if(!this.dead){ var p=o.position; var dx=rp.x-p.x, dz=rp.z-p.z; var dist=Math.hypot(dx,dz)||1; if(dist<1.2){ damagePlayer(this.touchDmg||16); this.remove0(); return; }
        var faceY=Math.atan2(dx,dz); this.phase+=s*(2.5+this.speed*3.5); p.x+=(dx/dist)*this.speed*s+Math.cos(this.phase)*0.003; p.z+=(dz/dist)*this.speed*s;
        if(this.glbMode){ o.rotation.set(0,faceY+GLB_FACING,0); }
        else if(this.built){ var sw=Math.sin(this.phase),sw2=Math.sin(this.phase+Math.PI);
          if(this.crawler){ o.rotation.set(1.25,faceY,0); o.position.y=0; if(this.parts.armL)this.parts.armL.object3D.rotation.x=-1+Math.sin(this.phase)*0.45; if(this.parts.armR)this.parts.armR.object3D.rotation.x=-1+Math.sin(this.phase+Math.PI)*0.45; }
          else { var lurch=Math.sin(this.phase)*0.05; var lean=(this.legs===1)?0.25:0; o.rotation.set(0.12,faceY,lurch+lean); o.position.y=0.02+0.02*Math.abs(Math.sin(this.phase));
            if(this.parts.legL)this.parts.legL.object3D.rotation.x=sw*0.55; if(this.parts.legR)this.parts.legR.object3D.rotation.x=sw2*0.55;
            if(this.parts.armL)this.parts.armL.object3D.rotation.x=ARM_BASE+Math.sin(this.phase*0.5)*0.22; if(this.parts.armR)this.parts.armR.object3D.rotation.x=ARM_BASE+Math.sin(this.phase*0.5+1)*0.22;
            if(this.parts.head)this.parts.head.object3D.rotation.z=Math.sin(this.phase*0.5)*0.12; } }
      } else { if(this.glbMode){ this.dieTimer+=s; if(this.dieTimer>1.2){ var op=Math.max(0,1-(this.dieTimer-1.2)/1.2); o.traverse(function(m){ if(m.material){m.material.transparent=true;m.material.opacity=op;} }); } if(this.dieTimer>2.6&&this.el.parentNode)this.el.parentNode.removeChild(this.el); }
        else { this.dieTimer+=s; o.position.x+=this.knock.x*s; o.position.z+=this.knock.z*s; this.knock.multiplyScalar(0.86); var tg=Math.PI/2*this.fallDir; if(this.fallAxis==='x')o.rotation.x+=(tg-o.rotation.x)*Math.min(1,s*8); else o.rotation.z+=(tg-o.rotation.z)*Math.min(1,s*8); o.position.y=Math.max(0,0.2-this.dieTimer*0.4); var op2=Math.max(0,1-this.dieTimer/1.6); o.traverse(function(m){ if(m.material){m.material.transparent=true;m.material.opacity=op2;} }); if(this.dieTimer>1.7&&this.el.parentNode)this.el.parentNode.removeChild(this.el); } } }
  });

  // ---------- level-director ----------
  AFRAME.registerComponent('level-director',{ init:function(){ this.acc=0; },
    tick:function(t,dt){ if(window.PHASE!=='playing')return; this.acc+=(dt||16);
      const L=window.LEVELS[window.LEVEL];
      if(window.NODE_SPAWNED<window.NODE_QUOTA && window.ZOMBIES.length<L.maxCon && this.acc>L.interval){ this.acc=0; this.spawn(L); }
      if(window.NODE_SPAWNED>=window.NODE_QUOTA && window.ZOMBIES.length===0){ window.PHASE='advancing'; window.advanceNode(); } },
    spawn:function(L){ const rp=rigPos(); const z=rp.z-(13+Math.random()*10); const x=(Math.random()-0.5)*window.CORRIDOR_W; const zb=document.createElement('a-entity'); zb.setAttribute('position',x+' 0 '+z); zb.setAttribute('zombie',''); this.el.sceneEl.appendChild(zb); window.NODE_SPAWNED++; } });

  // ---------- GUN ----------
  AFRAME.registerComponent('gun',{
    init:function(){ this.ray=new THREE.Raycaster(); this.ray.far=90; this.origin=new THREE.Vector3(); this.dir=new THREE.Vector3(); this.q=new THREE.Quaternion(); this.muzzle=new THREE.Vector3();
      this.flash=this.el.querySelector('#muzzleFlash'); this.aimGroup=this.el.querySelector('#aimGroup'); var self=this;
      this.el.addEventListener('triggerdown',function(){ if(window.PHASE==='playing') self.shoot(false); });
      window.addEventListener('mousedown',function(){ if(window.PHASE==='playing') self.shoot(true); });
      window.addEventListener('keydown',function(e){ if(e.code==='Space'&&window.PHASE==='playing') self.shoot(true); }); },
    shoot:function(fromCam){ bang(); if(this.flash){ this.flash.setAttribute('visible',true); var f=this.flash; setTimeout(function(){ f.setAttribute('visible',false); },45); }
      if(fromCam){ var cam=document.querySelector('a-camera')||document.querySelector('[camera]'); var src=cam?cam.object3D:this.el.object3D; src.getWorldPosition(this.origin); src.getWorldQuaternion(this.q); }
      else if(this.aimGroup){ this.aimGroup.object3D.getWorldPosition(this.origin); this.aimGroup.object3D.getWorldQuaternion(this.q); }
      else { this.el.object3D.getWorldPosition(this.origin); this.el.object3D.getWorldQuaternion(this.q); }
      this.dir.set(0,0,-1).applyQuaternion(this.q).normalize(); this.ray.set(this.origin,this.dir);
      var best=null,bd=Infinity,bo=null,bp=null; for(var i=0;i<window.ZOMBIES.length;i++){ var el=window.ZOMBIES[i]; var h=this.ray.intersectObject(el.object3D,true); if(h.length&&h[0].distance<bd){ bd=h[0].distance; best=el; bo=h[0].object; bp=h[0].point.clone(); } }
      this.muzzle.copy(this.origin).addScaledVector(this.dir,0.24); var end=bp?bp:this.origin.clone().addScaledVector(this.dir,60); spawnBeam(this.muzzle,end,'#ffd98a',0.012,70);
      if(best){ blood(bp,this.dir); var o=bo,part=null; while(o){ if(o.userData&&o.userData.part){part=o.userData.part;break;} o=o.parent; } var c=best.object3D.userData.zombieComp; if(c) c.hitPart(part||'torso',this.dir,bp); } }
  });

  function startGame(){ if(window.STARTED)return; window.STARTED=true; ensureAudio(); startAmbience();
    const menu=document.querySelector('#menu'); if(menu&&menu.parentNode)menu.parentNode.removeChild(menu);
    document.querySelectorAll('.hand').forEach(function(h){ h.removeAttribute('cursor'); h.removeAttribute('raycaster'); const ml=h.querySelector('.menu-laser'); if(ml&&ml.parentNode)ml.parentNode.removeChild(ml); });
    const hud=document.querySelector('#hud'); if(hud)hud.setAttribute('visible',true);
    const handEl=document.querySelector(window.GUN_HAND==='right'?'#rightHand':'#leftHand'); if(handEl) buildGun(handEl);
    window.beginLevel(0); }
  </script>
</head>
<body>
  <a-scene level-director renderer="colorManagement: true; antialias: true; highRefreshRate: true; foveationLevel: 0"

    <!-- SPELER -->

      <a-plane id="btnLeft" class="menu-btn" position="-0.38 1.48 -1.98" width="0.6" height="0.16" material="color:#2a6f4a;opacity:0.95;transparent:true"></a-plane>
      <a-text value="LINKS" align="center" color="#fff" width="2.2" position="-0.38 1.48 -1.97"></a-text>
      <a-plane id="btnRight" class="menu-btn" position="0.38 1.48 -1.98" width="0.6" height="0.16" material="color:#1d2230;opacity:0.95;transparent:true"></a-plane>
      <a-text value="RECHTS" align="center" color="#fff" width="2.2" position="0.38 1.48 -1.97"></a-text>

    <script>
    // ============ CONTROL LAYER ============
    (function(){
      const world=()=>document.querySelector('#world');
      function el(tag,attrs){ const e=document.createElement(tag); for(const k in attrs) e.setAttribute(k,attrs[k]); world().appendChild(e); return e; }

      // ---- prop-helpers ----
      function tree(x,z){ const t=document.createElement('a-entity');
        t.innerHTML='<a-cylinder position="'+x+' 1 '+z+'" radius="0.18" height="2" color="#3b2c1e"></a-cylinder>'+
          '<a-cone position="'+x+' 2.4 '+z+'" radius-bottom="1.1" radius-top="0" height="1.6" color="#1f3a24"></a-cone>'+
          '<a-cone position="'+x+' 3.2 '+z+'" radius-bottom="0.85" radius-top="0" height="1.4" color="#264a2c"></a-cone>'+
          '<a-cone position="'+x+' 3.9 '+z+'" radius-bottom="0.6" radius-top="0" height="1.2" color="#2c5533"></a-cone>';
        world().appendChild(t); }
      function torch(x,z,face){ const t=document.createElement('a-entity');
        t.innerHTML='<a-cylinder position="'+x+' 1.4 '+z+'" radius="0.04" height="0.5" rotation="'+(face*20)+' 0 0" color="#2a2018"></a-cylinder>'+
          '<a-sphere position="'+x+' 1.7 '+z+'" radius="0.11" material="color:#ff8a1e;emissive:#ff6a00;emissiveIntensity:1.6;shader:flat"></a-sphere>';
        world().appendChild(t); const li=document.createElement('a-entity'); li.setAttribute('position',x+' 1.75 '+z); li.setAttribute('light','type: point; color:#ff8a30; intensity:1.1; distance:8; decay:2'); li.setAttribute('flicker','base:1.1'); world().appendChild(li); }
      function ceilingLight(x,z){ const li=document.createElement('a-entity'); li.setAttribute('position',x+' 2.8 '+z); li.setAttribute('light','type: point; color:#ffd9a0; intensity:0.9; distance:9; decay:2'); li.setAttribute('flicker','base:0.9'); world().appendChild(li);
        el('a-plane',{position:x+' 2.98 '+z,rotation:'90 0 0',width:0.6,height:0.6,material:'color:#fff0c0;emissive:#ffdf94;emissiveIntensity:0.7;shader:flat'}); }

      // ---- LEVEL BUILDERS ----
      function buildHouse(len){
        el('a-plane',{rotation:'-90 0 0',width:4,height:len+8,position:'0 0 '+(-(len)/2),material:'color:#4a3a2a;shader:flat',shadow:'receive:true'});
        el('a-plane',{rotation:'90 0 0',width:4,height:len+8,position:'0 3 '+(-(len)/2),material:'color:#241c14;shader:flat'});
        for(const sx of [-2,2]){ el('a-box',{position:sx+' 1.5 '+(-(len)/2),width:0.2,height:3,depth:len+8,material:'color:#3a2e20;shader:flat',shadow:'cast:true'}); }
        for(let z=-3;z>-len;z-=6){ if(Math.random()<0.7) ceilingLight(0,z);
          // schilderij / raam
          const sx=(Math.random()<0.5)?-1.89:1.89; const ry=(sx<0)?90:-90;
          el('a-plane',{position:sx+' 1.6 '+z,rotation:'0 '+ry+' 0',width:0.7,height:0.9,material:'color:#101828;emissive:#22406a;emissiveIntensity:0.5;shader:flat'});
          // meubel
          if(Math.random()<0.6){ const fx=(Math.random()<0.5)?-1.3:1.3; el('a-box',{position:fx+' 0.4 '+(z-1),width:0.8,height:0.8,depth:0.5,color:'#2c2016',shadow:'cast:true'}); }
          if(Math.random()<0.3){ el('a-box',{position:'0 0.25 '+(z-2),width:0.9,height:0.5,depth:0.6,color:'#241a12',shadow:'cast:true'}); } }
      }
      function buildStreet(len){
        el('a-plane',{rotation:'-90 0 0',width:9,height:len+10,position:'0 0 '+(-(len)/2),color:'#3a3d42',shadow:'receive:true'});
        el('a-box',{position:'3.9 0.1 '+(-(len)/2),width:1,height:0.2,depth:len+10,color:'#52555c'});
        el('a-box',{position:'-3.9 0.1 '+(-(len)/2),width:1,height:0.2,depth:len+10,color:'#52555c'});
        const cols=['#3a3f46','#434952','#33373e','#3f444c'];
        for(let z=-4;z>-len;z-=5){ for(const sx of [-6,6]){ const h=4+Math.random()*9; el('a-box',{position:(sx+(sx<0?Math.random()*0.6:-Math.random()*0.6))+' '+(h/2)+' '+z,width:3+Math.random(),height:h,depth:5,color:cols[Math.floor(Math.random()*cols.length)],shadow:'cast:true'});
            if(Math.random()<0.4){ const side=sx<0?1:-1; el('a-plane',{position:(sx+side*1.6)+' '+(1+Math.random()*(h-1.5))+' '+z,rotation:'0 '+(side*90)+' 0',width:0.35,height:0.5,material:'color:#ffcf6e;emissive:#ffcf6e;emissiveIntensity:0.7;shader:flat'}); } } }
        let k=0; for(let z=-3;z>-len;z-=7){ for(const sx of [-3.2,3.2]){ el('a-cylinder',{position:sx+' 1.6 '+z,radius:0.05,height:3.2,color:'#2a2c30'}); el('a-sphere',{position:sx+' 3.2 '+z,radius:0.13,material:'color:#fff1c0;emissive:#ffdf94;emissiveIntensity:1.3;shader:flat'}); const li=document.createElement('a-entity'); li.setAttribute('position',sx+' 3.1 '+z); li.setAttribute('light','type: point; color:#ffcf7a; intensity:1.1; distance:12; decay:2'); li.setAttribute('flicker','base:1.2'); world().appendChild(li); } k++; }
        for(let z=-8;z>-len;z-=16){ const cx=(Math.random()<0.5)?-2.6:2.6; const c=document.createElement('a-entity'); c.setAttribute('position',cx+' 0 '+z); c.setAttribute('rotation','0 '+((Math.random()<0.5)?0:180)+' 0'); c.setAttribute('gltf-fallback','src: models/car.glb; fb: car; scale: 1 1 1; rot: 0 0 0'); c.setAttribute('shadow','cast:true'); world().appendChild(c); }
        for(let z=-9;z>-len;z-=13){ const bx=(Math.random()<0.5)?-2.7:2.7; const b=document.createElement('a-entity'); b.setAttribute('position',bx+' 0 '+z); b.setAttribute('gltf-fallback','src: models/barrel.glb; fb: barrel; scale: 1 1 1; rot: 0 0 0'); b.setAttribute('shadow','cast:true'); world().appendChild(b);
          el('a-cone',{position:bx+' 1.05 '+z,'radius-bottom':0.22,'radius-top':0.02,height:0.5,material:'color:#ff7a18;emissive:#ff5a00;emissiveIntensity:1.2;transparent:true;opacity:0.85;shader:flat'}); const li=document.createElement('a-entity'); li.setAttribute('position',bx+' 1 '+z); li.setAttribute('light','type: point; color:#ff8a30; intensity:1.2; distance:8; decay:2'); li.setAttribute('flicker','base:1.2'); world().appendChild(li); }
        for(let i=0;i<Math.floor(len/2);i++) el('a-box',{position:((Math.random()-0.5)*6)+' 0.1 '+(-3-Math.random()*(len-4)),width:0.2+Math.random()*0.3,height:0.15,depth:0.2+Math.random()*0.3,color:'#41454c'});
      }
      function buildForest(len){
        el('a-plane',{rotation:'-90 0 0',width:22,height:len+12,position:'0 0 '+(-(len)/2),color:'#243421',shadow:'receive:true'});
        el('a-plane',{rotation:'-90 0 0',width:2.4,height:len+12,position:'0 0.01 '+(-(len)/2),color:'#4a3d2a'});
        for(let z=-3;z>-len;z-=2.4){ if(Math.random()<0.85) tree(-2.2-Math.random()*4,z+ (Math.random()-0.5)*1.5); if(Math.random()<0.85) tree(2.2+Math.random()*4,z+(Math.random()-0.5)*1.5);
          if(Math.random()<0.25) el('a-sphere',{position:((Math.random()<0.5)?-1.6:1.6)+' 0.3 '+z,radius:0.35+Math.random()*0.3,color:'#22331f'});
          if(Math.random()<0.2) el('a-dodecahedron',{position:((Math.random()<0.5)?-1.4:1.4)+' 0.2 '+z,radius:0.3,color:'#3a3d40'});
          if(Math.random()<0.3){ el('a-sphere',{position:((Math.random()-0.5)*8)+' '+(1+Math.random()*2)+' '+z,radius:0.03,material:'color:#c8ff8a;emissive:#a8ff5a;emissiveIntensity:1;shader:flat'}); } }
      }
      function buildCave(len){
        el('a-plane',{rotation:'-90 0 0',width:6,height:len+10,position:'0 0 '+(-(len)/2),color:'#1c1a1e',shadow:'receive:true'});
        el('a-plane',{rotation:'90 0 0',width:6,height:len+10,position:'0 3.6 '+(-(len)/2),color:'#0e0d10'});
        for(const sx of [-2.6,2.6]){ el('a-box',{position:sx+' 1.8 '+(-(len)/2),width:0.8,height:3.8,depth:len+10,color:'#17151a',shadow:'cast:true'}); }
        for(let z=-3;z>-len;z-=3){ el('a-cone',{position:((Math.random()<0.5)?-1.9:1.9)+' 0.5 '+z,'radius-bottom':0.35,'radius-top':0,height:1+Math.random(),color:'#211f26',rotation:'180 0 0'});
          el('a-cone',{position:((Math.random()<0.5)?-1.6:1.6)+' 3.1 '+z,'radius-bottom':0.3,'radius-top':0,height:0.9+Math.random()*0.8,color:'#1a181e'});
          if(Math.random()<0.4){ const cx=(Math.random()<0.5)?-2:2; el('a-cone',{position:cx+' 1.2 '+z,'radius-bottom':0.12,'radius-top':0.02,height:0.5,material:'color:#6ad0ff;emissive:#3aa8ff;emissiveIntensity:1.2;shader:flat'}); } }
        for(let z=-4;z>-len;z-=9){ torch(-2.3,z,1); torch(2.3,z,-1); }
      }

      window.LEVELS=[
        { key:'house', name:'HET HUIS', story:'De schuilplaats is gevallen. De besmetting kruipt door de gangen. Schiet je een weg naar de voordeur.',
          nodes:8, step:6, width:2.6, maxCon:6, interval:1050, speedMult:1.0, perNode:function(n){return 3+Math.floor(n/2);},
          mood:{fog:'type: exponential; color:#0a0806; density:0.06', amb:'#2a2016', ambI:0.55, dir:'#3a2f22', dirI:0.4}, build:buildHouse },
        { key:'street', name:'DE STRAAT', story:'Buiten wacht de horde. De stad is verloren. Werk je naar het einde van de straat, richting de bosrand.',
          nodes:20, step:6, width:5, maxCon:11, interval:800, speedMult:1.15, perNode:function(n){return 4+Math.floor(n/3);},
          mood:{fog:'type: exponential; color:#060810; density:0.032', amb:'#20263a', ambI:0.5, dir:'#3a4a6a', dirI:0.35, sky:['#05070f','#161d2e']}, build:buildStreet },
        { key:'forest', name:'HET BOS', story:'Voorbij de stad, tussen de bomen. Ze komen uit het donker tussen de stammen vandaan. Volg het pad dieper het bos in.',
          nodes:14, step:6, width:4, maxCon:9, interval:900, speedMult:1.25, perNode:function(n){return 4+Math.floor(n/2);},
          mood:{fog:'type: exponential; color:#0a1410; density:0.045', amb:'#1a2a20', ambI:0.5, dir:'#3a5a4a', dirI:0.4, sky:['#0a1522','#1a2a20']}, build:buildForest },
        { key:'cave', name:'DE GROT', story:'Hier begon het. Diep onder de grond klopt het hart van de plaag. Maak er een einde aan.',
          nodes:12, step:6, width:3, maxCon:9, interval:820, speedMult:1.35, perNode:function(n){return 5+Math.floor(n/2);},
          mood:{fog:'type: exponential; color:#050406; density:0.06', amb:'#161020', ambI:0.4, dir:'#221a2e', dirI:0.2}, build:buildCave }
      ];

      function setTheme(L){ const scene=document.querySelector('a-scene'); scene.setAttribute('fog',L.mood.fog);
        const amb=document.querySelector('#ambLight'); amb.setAttribute('light','type: ambient; color:'+L.mood.amb+'; intensity:'+L.mood.ambI);
        const dir=document.querySelector('#dirLight'); dir.setAttribute('light','type: directional; color:'+L.mood.dir+'; intensity:'+L.mood.dirI+'; castShadow: true; shadowMapWidth: 2048; shadowMapHeight: 2048; shadowCameraLeft: -24; shadowCameraRight: 24; shadowCameraTop: 24; shadowCameraBottom: -24; shadowCameraNear: 0.5; shadowCameraFar: 80');
        const sky=document.querySelector('#sky'); if(L.mood.sky){ applySkyGradient(L.mood.sky[0],L.mood.sky[1]); } else { const m=sky.getObject3D('mesh'); if(m){m.material.map=null;m.material.needsUpdate=true;} sky.setAttribute('color','#05060a'); } }

      function armContinue(cb){ let done=false; function fire(){ if(done)return; done=true; document.querySelectorAll('.hand').forEach(function(h){ h.removeEventListener('triggerdown',fire); }); window.removeEventListener('mousedown',fire); cb(); }
        document.querySelectorAll('.hand').forEach(function(h){ h.addEventListener('triggerdown',fire); }); window.addEventListener('mousedown',fire); }
      window.armContinue=armContinue;

      window.beginLevel=function(i){ const L=window.LEVELS[i]; window.LEVEL=i; window.HEALTH=100; updateHealthUI();
        STATS.head=0; STATS.body=0; STATS.levelStart=performance.now(); window.NODE=0; window.CORRIDOR_W=L.width; window.SPEEDMULT=L.speedMult;
        clearZombies(); world().innerHTML=''; const len=L.nodes*L.step+24; L.build(len); setTheme(L);
        window.RIG.setAttribute('position','0 0 0');
        window.PHASE='story'; const st=document.querySelector('#story'); document.querySelector('#storyTitle').setAttribute('value',L.name); document.querySelector('#storyBody').setAttribute('value',L.story); st.setAttribute('visible',true);
        updateHUD(); armContinue(function(){ st.setAttribute('visible',false); window.startNode(0); }); };

      window.startNode=function(n){ const L=window.LEVELS[window.LEVEL]; window.NODE=n; window.NODE_SPAWNED=0; window.NODE_KILLS=0; window.NODE_QUOTA=L.perNode(n); window.PHASE='playing'; updateHUD(); };

      window.advanceNode=function(){ const L=window.LEVELS[window.LEVEL]; if(window.NODE+1>=L.nodes){ window.levelComplete(); return; }
        const rig=window.RIG; const nz=rig.object3D.position.z - L.step;
        rig.setAttribute('animation__adv','property: position; to: 0 0 '+nz+'; dur: 2000; easing: easeInOutQuad');
        const h=function(){ rig.removeEventListener('animationcomplete__adv',h); window.startNode(window.NODE+1); }; rig.addEventListener('animationcomplete__adv',h); };

      window.levelComplete=function(){ window.PHASE='levelcomplete'; clearZombies(); const secs=((performance.now()-STATS.levelStart)/1000);
        const le=document.querySelector('#levelend'); const last=(window.LEVEL+1>=window.LEVELS.length);
        document.querySelector('#leTitle').setAttribute('value', last?'JE HEBT HET OVERLEEFD':'LEVEL VOLTOOID: '+window.LEVELS[window.LEVEL].name);
        document.querySelector('#leStats').setAttribute('value','Kopschoten: '+STATS.head+'    Lichaam: '+STATS.body+'\nTijd: '+secs.toFixed(1)+'s    Leven over: '+Math.round(window.HEALTH)+'%');
        document.querySelector('#leNext').setAttribute('value', last?('Totaal kills: '+(STATS.totalHead+STATS.totalBody)):('Volgende: '+window.LEVELS[window.LEVEL+1].name));
        le.setAttribute('visible',true);
        armContinue(function(){ le.setAttribute('visible',false); if(last){ location.reload(); } else { window.beginLevel(window.LEVEL+1); } }); };

      window.updateHUD=function(){ const L=window.LEVELS[window.LEVEL]; document.querySelector('#levelText').setAttribute('value',L?L.name:''); document.querySelector('#progressText').setAttribute('value',L?('Stap '+(window.NODE+1)+'/'+L.nodes):''); };

      window.addEventListener('load',function(){ window.RIG=document.querySelector('#rig');
        const bl=document.querySelector('#btnLeft'),br=document.querySelector('#btnRight'),bs=document.querySelector('#btnStart');
        if(bl)bl.addEventListener('click',function(){ window.GUN_HAND='left'; updateHandUI(); });
        if(br)br.addEventListener('click',function(){ window.GUN_HAND='right'; updateHandUI(); });
        if(bs)bs.addEventListener('click',function(){ startGame(); });
        updateHandUI(); });
    })();
    </script>
  </a-scene>
</body>
</html>
