  let TOTALT=0; SCENES.forEach(sc=>{ sc.t0=TOTALT; TOTALT+=sc.dur; });

  // =========================================================
  //  MUZIEK
  // =========================================================
  let A=null,MASTER=null,DUCK=null,DELAY=null,DRONE=null;
  let TRACKS=[null,null],ANA=null,ANAD=null,TGAIN=[null,null],SWITCHED=false;
  const TRACK_URLS=[
    ['Music/Track.mp3','music/Track.mp3','Music/track.mp3','Music/Track1.mp3','Music/TRACK.mp3','Music/Track.MP3'],
    ['Music/Track2.mp3','music/Track2.mp3','Music/track2.mp3','Music/TRACK2.mp3','Music/Track2.MP3',
     'Music/Track_2.mp3','music/Track_2.mp3','Music/Track-2.mp3','Music/Track%202.mp3','Music/Track%202%20.mp3',
     'Music/Track02.mp3','Music/track_2.mp3','Music/2.mp3','Music/Track2.m4a','Music/Track2.wav','Music/Track2.ogg']
  ];

  function AC(){ if(A) return A; A=new (window.AudioContext||window.webkitAudioContext)();
    MASTER=A.createGain(); MASTER.gain.value=0.5; MASTER.connect(A.destination);
    DUCK=A.createGain(); DUCK.gain.value=1; DUCK.connect(MASTER);
    DELAY=A.createDelay(1.2); DELAY.delayTime.value=0.32;
    const fb=A.createGain(); fb.gain.value=0.42; const fl=A.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=3200;
    const dw=A.createGain(); dw.gain.value=0.5;
    DELAY.connect(fl).connect(fb).connect(DELAY); DELAY.connect(dw).connect(DUCK);
    return A; }
  function markFound(){ const el=$('#trkInfo'); if(!el) return;
    const nm=function(t){ return t? (t._url||'ok').split('/').pop() : 'NIET GEVONDEN'; };
    el.setAttribute('value','1: '+nm(TRACKS[0])+'\n2: '+nm(TRACKS[1]));
    el.setAttribute('color',(TRACKS[0]&&TRACKS[1])?'#6ad1a0':'#c08a5a'); }
  function tryTrack(){ TRACK_URLS.forEach(function(l,i){ probe(l,0,i); }); }
  function probe(list,k,i){ if(k>=list.length){ markFound(); return; }
    const au=new Audio(); au.src=list[k]; au.preload='metadata'; au.loop=false;
    const ok=function(){ if(!TRACKS[i]){ au._url=list[k]; TRACKS[i]=au; markFound(); } };
    au.addEventListener('loadedmetadata',ok,{once:true});
    au.addEventListener('canplaythrough',ok,{once:true});
    au.addEventListener('error',function(){ probe(list,k+1,i); }); au.load(); }
  let PROBING=false;
  setInterval(function(){ if(window.PHASE!=='menu'||PROBING) return;
    if(TRACKS[0]&&TRACKS[1]) return; PROBING=true;
    TRACK_URLS.forEach(function(l,i){ if(!TRACKS[i]) probe(l,0,i); });
    setTimeout(function(){ PROBING=false; },4000); },6000);
  function switchTrack(){ if(SWITCHED) return; SWITCHED=true;
    if(!TRACKS[1]||!TGAIN[1]){ if(TRACKS[0]) TRACKS[0].loop=true; return; }  // geen 2e track: 1e blijft lopen
    const t=A.currentTime; TRACKS[1].loop=true; try{ TRACKS[1].play(); }catch(e){}
    if(TGAIN[0]) TGAIN[0].gain.linearRampToValueAtTime(0,t+3);
    TGAIN[1].gain.setValueAtTime(0,t); TGAIN[1].gain.linearRampToValueAtTime(1,t+3);
    setTimeout(function(){ try{ if(TRACKS[0]) TRACKS[0].pause(); }catch(e){} },3500); }
  function duckNow(t){ if(!DUCK)return; DUCK.gain.cancelScheduledValues(t);
    DUCK.gain.setValueAtTime(0.32,t); DUCK.gain.linearRampToValueAtTime(1.0,t+0.22); }
  function supersaw(f,t,dur,vol,dest,att,bright){ const a=AC(); const g=a.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+(att||0.02));
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    const fl=a.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=bright||2400;
    [-9,0,9].forEach(function(d){ const o=a.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.detune.value=d;
      o.connect(fl); o.start(t); o.stop(t+dur+0.05); });
    fl.connect(g).connect(dest||DUCK); }
  function note(f,t,dur,vol,type,dest,att){ const a=AC(); const o=a.createOscillator(); o.type=type||'sine'; o.frequency.value=f;
    const g=a.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+(att||0.02));
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(dest||DUCK); o.start(t); o.stop(t+dur+0.05); }
  function kickAt(t,vol){ const a=AC(); const o=a.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(36,t+0.11);
    const g=a.createGain(); g.gain.setValueAtTime(vol||0.85,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.18);
    o.connect(g).connect(MASTER); o.start(t); o.stop(t+0.22);
    const len=Math.floor(a.sampleRate*0.012); const b=a.createBuffer(1,len,a.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const n=a.createBufferSource(); n.buffer=b; const hf=a.createBiquadFilter(); hf.type='highpass'; hf.frequency.value=3000;
    const ng=a.createGain(); ng.gain.value=(vol||0.85)*0.35; n.connect(hf).connect(ng).connect(MASTER); n.start(t);
    duckNow(t);
    const ms=Math.max(0,(t-a.currentTime)*1000); setTimeout(function(){ window.BEAT=1; },ms); }
  function hatAt(t,vol,open){ const a=AC(); const dur=open?0.12:0.035;
    const len=Math.floor(a.sampleRate*dur); const b=a.createBuffer(1,len,a.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,open?1.2:2);
    const n=a.createBufferSource(); n.buffer=b; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=7500;
    const g=a.createGain(); g.gain.value=vol||0.12; n.connect(f).connect(g).connect(MASTER); n.start(t); }
  function acidAt(f,t){ const a=AC(); const o=a.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
    const flt=a.createBiquadFilter(); flt.type='lowpass'; flt.Q.value=14;
    flt.frequency.setValueAtTime(280,t); flt.frequency.exponentialRampToValueAtTime(2400,t+0.08); flt.frequency.exponentialRampToValueAtTime(340,t+0.22);
    const g=a.createGain(); g.gain.setValueAtTime(0.085,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.24);
    o.connect(flt).connect(g).connect(DUCK); o.start(t); o.stop(t+0.3); }
  function riser(){ const a=AC(); const t=a.currentTime; const len=Math.floor(a.sampleRate*2); const b=a.createBuffer(1,len,a.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(i/len);
    const n=a.createBufferSource(); n.buffer=b; const f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=2;
    f.frequency.setValueAtTime(200,t); f.frequency.exponentialRampToValueAtTime(4500,t+2);
    const g=a.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.2,t+1.6); g.gain.linearRampToValueAtTime(0,t+2.1);
    n.connect(f).connect(g).connect(MASTER); n.start(t); }
  function startDrone(){ const a=AC(); if(DRONE) return;
    const o1=a.createOscillator(); o1.type='sawtooth'; const o2=a.createOscillator(); o2.type='sawtooth'; o2.detune.value=9;
    const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=500;
    const lfo=a.createOscillator(); lfo.frequency.value=0.08; const lg=a.createGain(); lg.gain.value=260; lfo.connect(lg).connect(f.frequency); lfo.start();
    const g=a.createGain(); g.gain.value=0.045;
    o1.connect(f); o2.connect(f); f.connect(g).connect(DUCK); o1.start(); o2.start(); DRONE={o1:o1,o2:o2,f:f}; }
  const MUS={cfg:null,nextT:0,step:0,phrase:[]};
  function makePhrase(c){ const ph=[]; const off=Math.floor(Math.random()*c.mode.length);
    for(let i=0;i<16;i++) ph.push(c.mode[(off+i*3)%c.mode.length]+(((i%8)>5)?12:0)); return ph; }
  function setMusic(cfg){ const a=AC(); MUS.cfg=cfg; MUS.step=0;
    cfg.prog=(cfg.mode.indexOf(4)>=0)?[0,9,5,7]:[0,8,3,10]; MUS.phrase=makePhrase(cfg);
    if(DRONE){ DRONE.o1.frequency.linearRampToValueAtTime(cfg.root/2,a.currentTime+2.5);
      DRONE.o2.frequency.linearRampToValueAtTime(cfg.root/2*1.004,a.currentTime+2.5);
      DRONE.f.frequency.linearRampToValueAtTime(Math.max(300,cfg.bright*0.35),a.currentTime+2.5); } }
  function musTick(){ if(!A||!MUS.cfg||window.PHASE!=='trip'||window.USE_TRACK) return; const a=A,c=MUS.cfg;
    const stepDur=60/c.bpm/4;
    if(MUS.nextT<a.currentTime) MUS.nextT=a.currentTime+0.05;
    while(MUS.nextT<a.currentTime+0.28){
      const t=MUS.nextT,i=MUS.step,bar=Math.floor(i/16),pos=i%16,sect=bar%16;
      const chord=c.root*Math.pow(2,(c.prog[Math.floor(bar/2)%4])/12);
      if(pos===0&&bar%8===0) MUS.phrase=makePhrase(c);
      if(i%32===0){ supersaw(chord,t,4.6,0.07,DUCK,1.6,1400);
        supersaw(chord*Math.pow(2,(c.mode.indexOf(3)>=0?3:4)/12),t,4.6,0.05,DUCK,1.8,1300);
        supersaw(chord*1.4983,t,4.6,0.05,DUCK,2.0,1300); }
      if(pos%4===0) kickAt(t,0.9); else note(chord/2,t,0.12,0.17,'sawtooth',DUCK,0.004);
      if(sect>=2) hatAt(t,pos%4===2?0.13:0.045);
      supersaw(c.root*2*Math.pow(2,MUS.phrase[pos]/12),t,0.14,0.055,DELAY,0.008,c.bright);
      if(c.acid&&sect>=6&&pos%2===0&&Math.random()<0.5) acidAt(c.root*Math.pow(2,pick(c.mode)/12)*(Math.random()<0.3?2:1),t);
      MUS.nextT+=stepDur; MUS.step++; } }
  setInterval(musTick,85);

  // =========================================================
  //  SHADERS
  // =========================================================
  const TUBE_LEN=320;
  const SHELL_VS=[
   'uniform float uTime,uWave,uRipZ,uRipAmp,uScale;',
   'varying vec2 vUv; varying float vAxis;',
   'void main(){ vUv=uv; vec3 p=position; float az=p.y; vAxis=az;',
   '  float w=1.0+uWave*0.26*sin(az*0.055+uTime*0.9)+uWave*0.15*sin(az*0.14-uTime*0.65);',
   '  float dd=az-uRipZ; w+=uRipAmp*exp(-dd*dd*0.0035);',
   '  p.x*=w*uScale; p.z*=w*uScale;',
   '  gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0); }'].join('\n');

   'precision highp float;',
   'uniform float uTime,uBeat,uMode,uFold,uSpeed,uAlpha,uGain,uWhite,uSharp,uFlash,uDark,uCut,uCutDir,uSwap,uFreq,uTexAmt,uTexRep;',

   'uniform vec3 uColA,uColB,uColD;',
   'varying vec2 vUv; varying float vAxis;',
   'vec3 pal(float t){ return uColA+uColB*cos(6.28318*(t+uColD)); }',
   'void main(){',
   '  float pu=mix(vUv.x,vUv.y,uSwap);',
   '  float pv=mix(vUv.y,vUv.x,uSwap);',
   '  float ang=pu*6.28318;',
   '  float d=pv*60.0*uFreq+uTime*uSpeed;',
   '  float t=0.5;',
   '  if(uMode<0.5){',
   '    t=0.5+0.22*(sin(ang*3.0+uTime)+sin(d*0.6+uTime*1.2)+sin(ang*2.0+d*0.4)+sin(d*0.2-uTime));',
   '  } else if(uMode<1.5){',
   '    float seg=6.28318/uFold;',
   '    float a2=abs(mod(ang+uTime*0.1,seg)-seg*0.5);',
   '    t=(sin(a2*uFold*2.0+sin(d*0.4))*0.5+0.5)*(sin(d-a2*8.0+uTime)*0.5+0.5)+0.4*(sin(a2*12.0+d*0.8-uTime)*0.5+0.5);',
   '  } else if(uMode<2.5){',
   '    vec2 p=vec2(cos(ang),sin(ang))*1.25;',
   '    p+=vec2(sin(d*0.09),cos(d*0.09))*0.45;',
   '    vec2 c=vec2(0.55+0.22*sin(uTime*0.06),0.35+0.22*cos(uTime*0.05));',
   '    float acc=0.0;',
   '    for(int i=0;i<10;i++){ p=abs(p)/dot(p,p)-c; acc+=exp(-length(p)*3.0); }',
   '    t=acc*0.32;',
   '  } else if(uMode<3.5){',
   '    float r1=sin(d*1.15)*0.5+0.5;',
   '    float r2=sin(d*1.31+ang*3.0)*0.5+0.5;',

   '  } else {',
   '    vec2 q=vec2(ang*1.6,d*0.22);',
   '    vec2 ip=floor(q), fp=fract(q);',
   '    float m=1.0;',
   '    for(int y=-1;y<=1;y++){ for(int x=-1;x<=1;x++){',
   '      vec2 g=vec2(float(x),float(y));',
   '      vec2 o=fract(sin(vec2(dot(ip+g,vec2(127.1,311.7)),dot(ip+g,vec2(269.5,183.3))))*43758.545);',
   '      o=0.5+0.5*sin(uTime*0.6+6.28318*o);',
   '      m=min(m,length(g+o-fp)); } }',
   '    t=m*1.7;',
   '  }',
   '  if(uTexAmt>0.001){ float px=texture2D(uTex,vec2(pu*uTexRep,pv*uTexRep*0.6+uTime*0.015)).r;',
   '    t=mix(t,t*0.30+px*1.25,uTexAmt); }',
   '  t*=uGain;',
   '  vec3 col=pal(t+uTime*0.02)*(0.7+0.6*uBeat)*uDark;',
   '  col=mix(col,vec3(1.0),clamp(uWhite+uFlash,0.0,1.0));',
   '  float a=uAlpha*clamp(pow(clamp(t,0.0,1.4),uSharp),0.0,1.0);',
   '  a*=smoothstep(0.0,0.05,pv)*smoothstep(1.0,0.95,pv);',
   '  float s1=smoothstep(uCut,uCut+24.0,vAxis);',
   '  a*=mix(1.0-s1,s1,step(0.0,uCutDir));',

  const OBJ_VS=[
   'uniform float uTime,uRipZ,uRipAmp,uSeed,uBreath;',
   'varying vec3 vP;',
   'void main(){ vec3 p=position;',
   '  p*=1.0+uBreath*0.12*sin(uTime*2.0+uSeed);',
   '  vP=p;',
   '  vec4 wp=modelMatrix*vec4(p,1.0);',
   '  float dd=wp.z-uRipZ;',

  const OBJ_FS=[
   'precision highp float;',
   'uniform float uTime,uBeat,uWhite,uFlash,uSeed,uPat,uDark;',
   'uniform vec3 uColA,uColB,uColD;',
   'varying vec3 vP;',
   'vec3 pal(float t){ return uColA+uColB*cos(6.28318*(t+uColD)); }',
   'void main(){',
   '  float t;',
   '  if(uPat<0.5){',
   '    float rr=length(vP.xy);',
   '    t=sin(rr*16.0-uTime*3.5+uSeed)*0.5+0.5;',
   '    t*=0.6+0.4*(sin(atan(vP.y,vP.x)*12.0+uTime)*0.5+0.5);',
   '  } else if(uPat<1.5){',
   '    float a=atan(vP.y,vP.x);',
   '    t=sin(a*14.0+uTime*2.2+uSeed)*0.5+0.5;',
   '    t*=0.5+0.5*(sin(vP.z*20.0-uTime*3.0)*0.5+0.5);',
   '  } else {',
   '    t=sin(vP.z*6.0+uTime*5.0+uSeed)*0.5+0.5;',
   '    t*=0.55+0.45*(sin(vP.x*14.0+vP.y*14.0-uTime*2.0)*0.5+0.5);',
   '  }',
   '  vec3 col=pal(t*1.1+uTime*0.03)*(0.8+0.7*uBeat)*uDark;',
   '  col=mix(col,vec3(1.0),clamp(uWhite+uFlash,0.0,1.0));',
   '  gl_FragColor=vec4(col,1.0); }'].join('\n');

  let PRINTS=null;
  function printTex(kind){ const cv=document.createElement('canvas'); cv.width=512; cv.height=512; const x=cv.getContext('2d');
    x.fillStyle='#000'; x.fillRect(0,0,512,512); x.strokeStyle='#fff'; x.fillStyle='#fff';
    if(kind===0){ for(let r=5;r<380;r+=8){ x.lineWidth=3; x.beginPath(); x.arc(256,256,r,0,6.283); x.stroke(); } }
    else if(kind===1){ for(let a=0;a<72;a++){ const th=a/72*6.283; x.lineWidth=4; x.beginPath();
        x.moveTo(256,256); x.lineTo(256+Math.cos(th)*400,256+Math.sin(th)*400); x.stroke(); }
      for(let r=40;r<380;r+=46){ x.lineWidth=5; x.beginPath(); x.arc(256,256,r,0,6.283); x.stroke(); } }
    else { for(let gy=0;gy<8;gy++) for(let gx=0;gx<8;gx++){ const cx=32+gx*64, cy=32+gy*64;
        x.lineWidth=3; x.beginPath(); x.ellipse(cx,cy,24,13,0,0,6.283); x.stroke();
        x.beginPath(); x.arc(cx,cy,8,0,6.283); x.fill(); } }
    const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t; }
  function getPrints(){ if(!PRINTS) PRINTS=[printTex(0),printTex(1),printTex(2)]; return PRINTS; }
  function shellU(){ return {
    uTime:{value:0},uBeat:{value:0},uMode:{value:0},uFold:{value:6},uSpeed:{value:8},
    uAlpha:{value:0.7},uGain:{value:1},uWhite:{value:0},uSharp:{value:2.0},uFlash:{value:0},
    uWave:{value:0.4},uRipZ:{value:9999},uRipAmp:{value:0},uScale:{value:1},uDark:{value:1},
    uCut:{value:9999},uCutDir:{value:-1},uSwap:{value:0},uFreq:{value:1},
    uTexAmt:{value:0},uTexRep:{value:1},uTex:{value:null},
    uColA:{value:new THREE.Vector3(0.07,0.06,0.16)},
    uColB:{value:new THREE.Vector3(0.45,0.40,0.85)},
    uColD:{value:new THREE.Vector3(0.00,0.15,0.35)} }; }
  function objU(seed,pat){ return {
    uTime:{value:0},uBeat:{value:0},uWhite:{value:0},uFlash:{value:0},uSeed:{value:seed},
    uPat:{value:pat},uDark:{value:1},uBreath:{value:1},uRipZ:{value:9999},uRipAmp:{value:0},
    uColA:{value:new THREE.Vector3(0.07,0.06,0.16)},
    uColB:{value:new THREE.Vector3(0.45,0.40,0.85)},
    uColD:{value:new THREE.Vector3(0.00,0.15,0.35)} }; }

  AFRAME.registerComponent('shaderworld',{
    init:function(){
      const root=this.el.object3D;
      // ---- tunnel: drie schillen op verschillende diepte ----
      this.shells=[];
      const SPEC=[{r:6,seg:56,ro:-6,sharp:2.2,gain:1.0,al:0.72},
                  {r:15,seg:44,ro:-5,sharp:1.7,gain:0.9,al:0.46},
                  {r:30,seg:36,ro:-4,sharp:1.3,gain:0.8,al:0.32}];
      for(let i=0;i<3;i++){ const S=SPEC[i]; const u=shellU();
        u.uSharp.value=S.sharp; u.uGain.value=S.gain; u.uAlpha.value=S.al;
        const geo=new THREE.CylinderGeometry(S.r,S.r,TUBE_LEN,S.seg,70,true);
        const m=new THREE.Mesh(geo,new THREE.ShaderMaterial({vertexShader:SHELL_VS,fragmentShader:SHELL_FS,
          uniforms:u,side:THREE.BackSide,transparent:true,depthWrite:false}));
        m.rotation.x=Math.PI/2; m.position.set(0,1.6,0); m.renderOrder=S.ro;
        root.add(m); this.shells.push({m:m,u:u,base:S.al}); }
      // ---- de bol om je heen (meestal weg) ----
      const du=shellU(); du.uMode.value=2; du.uSharp.value=1.0; du.uSpeed.value=1.2; du.uCut.value=99999; du.uDark.value=0;
      this.dome=new THREE.Mesh(new THREE.SphereGeometry(110,36,24),
        new THREE.ShaderMaterial({vertexShader:SHELL_VS,fragmentShader:SHELL_FS,uniforms:du,side:THREE.BackSide}));
      this.dome.position.set(0,1.6,0); this.dome.renderOrder=-20; root.add(this.dome); this.du=du;
      // ---- de bol AAN HET EIND van de tunnel: komt naar je toe en weer weg ----
      const ou=shellU(); ou.uMode.value=2; ou.uSharp.value=1.0; ou.uCut.value=99999; ou.uSpeed.value=3;
      this.orb=new THREE.Mesh(new THREE.SphereGeometry(15,40,28),
        new THREE.ShaderMaterial({vertexShader:SHELL_VS,fragmentShader:SHELL_FS,uniforms:ou,side:THREE.FrontSide}));
      this.orb.position.set(0,1.6,-90); root.add(this.orb); this.ou=ou; this.orbAmt=0;
      // ---- wanden: vlak onder je en naast je, schuiven hard dichtbij en weer weg ----
      this.walls=[];
      const mkWall=(geo,rot,pos,swap)=>{ const u=shellU(); u.uCut.value=99999; u.uWave.value=0; u.uSharp.value=1.5;
        u.uSwap.value=swap; u.uAlpha.value=0.0;
        const m=new THREE.Mesh(geo,new THREE.ShaderMaterial({vertexShader:SHELL_VS,fragmentShader:SHELL_FS,
          uniforms:u,side:THREE.DoubleSide,transparent:true,depthWrite:false}));
        m.rotation.set(rot[0],rot[1],rot[2]); m.position.set(pos[0],pos[1],pos[2]); m.renderOrder=-3;
        root.add(m); return {m:m,u:u}; };
      this.walls.push(mkWall(new THREE.PlaneGeometry(46,300),[-Math.PI/2,0,0],[0,-30,-60],0));   // vloer
      this.walls.push(mkWall(new THREE.PlaneGeometry(300,46),[0,Math.PI/2,0],[-42,4,-60],1));    // links
      this.walls.push(mkWall(new THREE.PlaneGeometry(300,46),[0,-Math.PI/2,0],[42,4,-60],1));    // rechts
      // ---- verschijningen ----
      const gDisc=new THREE.CylinderGeometry(1,1,0.12,28,1);
      const gRing=new THREE.TorusGeometry(0.85,0.26,12,28);
      const gGate=new THREE.TorusGeometry(1,0.07,10,40);
      const gShard=new THREE.IcosahedronGeometry(1,1);
      const gSeg=new THREE.SphereGeometry(1,14,10);
      const mkPool=(geo,n,pat,rotX)=>{ const arr=[];
        for(let i=0;i<n;i++){ const u=objU(i*1.9,pat);
          const m=new THREE.Mesh(geo,new THREE.ShaderMaterial({vertexShader:OBJ_VS,fragmentShader:OBJ_FS,uniforms:u}));
          if(rotX) m.rotation.x=rotX; m.visible=false; root.add(m); arr.push({m:m,u:u,i:i}); }
        return arr; };
      this.pools=[ mkPool(gDisc,8,0,Math.PI/2), mkPool(gGate,6,1,0), mkPool(gShard,7,2,0),
                   mkPool(gSeg,16,0,0), mkPool(gRing,8,1,0) ];
      this.pools[2].forEach(o=>o.m.scale.set(0.3,0.3,2.6));
      const PR=getPrints();
      for(let i=0;i<3;i++){ this.shells[i].u.uTex.value=PR[0]; this.shells[i].u.uFreq.value=[1.0,1.12,1.25][i]; }
      this.du.uTex.value=PR[0]; this.ou.uTex.value=PR[0];
      this.walls.forEach(w=>{ w.u.uTex.value=PR[0]; });
      this.snakeZ=-200; this.snakeSide=1; this.wAmt=[0,0,0]; this.texAmt=0;
      this.elapsed=0; this.scene=-1; this.ripZ=9999; this.ripAmp=0; this.flash=0;
      this.prevBeat=0; this.evPhase=0; this.domeAmt=0; this.wallAmt=0;
      this.cur={sp:8,wave:0.4,fold:6,A:new THREE.Vector3(0.07,0.06,0.16),B:new THREE.Vector3(0.45,0.4,0.85),D:new THREE.Vector3(0,0.15,0.35)};
    },
    fireRipple:function(){ this.ripZ=-190; this.ripAmp=1; },
    enter:function(SC){
      if(!window.USE_TRACK){ riser(); setMusic(SC.mus); }
      this.SC=SC; this.sc0=SC.t0; this.scDur=SC.dur; this.evPhase=0;
      const self=this;
      setTimeout(function(){ for(let i=0;i<3;i++) self.shells[i].u.uMode.value=SC.md[i];
        self.du.uMode.value=SC.md[2]; self.ou.uMode.value=SC.md[1];
        for(let i=0;i<3;i++) self.walls[i].u.uMode.value=SC.md[(i+1)%3]; },500);
      this.fireRipple();
      this.pools.forEach(p=>p.forEach(o=>{ o.m.visible=false; }));
      if(SC.ev===1) this.pools[1].forEach((o,i)=>{ o.m.position.set(rand(-1.2,1.2),1.6+rand(-0.8,0.8),-150+i*26);
        o.sc=6.5+rand(0,2.5); o.spin=rand(-0.7,0.7); o.m.scale.setScalar(o.sc); });
      if(SC.ev===2) this.pools[2].forEach((o,i)=>{ o.ang=rand(0,6.283); o.rad=rand(2.8,9);
        o.z=22+i*7; o.spin=rand(-1.2,1.2); });
      if(SC.ev===3){ this.snakeZ=-200; this.snakeSide=(Math.random()<0.5?1:-1); }
    },
    tick:function(t,dt){ const s=Math.min(0.08,(dt||16)/1000);
      if(window.USE_TRACK&&ANA){ ANA.getByteFrequencyData(ANAD); let b=0; for(let k=1;k<7;k++)b+=ANAD[k]; b/=(6*255);
        window.BEAT=Math.max((window.BEAT||0)*0.82,Math.max(0,(b-0.52)*2.4)); }
      else window.BEAT=Math.max(0,(window.BEAT||0)-s*5);
      const beat=window.BEAT, hit=(beat>0.6&&this.prevBeat<0.35); this.prevBeat=beat;
      const menu=(window.PHASE!=='trip');
      if(!menu){ this.elapsed+=s;
        let idx=SCENES.length-1;
        for(let i=0;i<SCENES.length;i++){ if(this.elapsed<SCENES[i].t0+SCENES[i].dur){ idx=i; break; } }
        if(idx!==this.scene){ this.scene=idx; this.enter(SCENES[idx]); } }
      const SC=this.SC||SCENES[0];
      const tEl=menu?0:(this.elapsed-this.sc0);
      const pr=menu?0:Math.min(1,Math.max(0,tEl/this.scDur));

      // ---- drift ----
      const wob=Math.sin(this.elapsed*0.21)*0.5+0.5;
      const tSp=(SC.sp[0]+(SC.sp[1]-SC.sp[0])*pr)*(0.85+0.3*wob)*(menu?0.4:1);
      const tWv=(SC.wave[0]+(SC.wave[1]-SC.wave[0])*pr)*(0.8+0.4*Math.sin(this.elapsed*0.13+1.2));
      const tFd=SC.fold[0]+(SC.fold[1]-SC.fold[0])*pr;
      const k=1-Math.exp(-s/0.7);
      this.cur.sp+=(tSp-this.cur.sp)*k; this.cur.wave+=(tWv-this.cur.wave)*k; this.cur.fold+=(tFd-this.cur.fold)*k;
      this.cur.A.lerp(new THREE.Vector3().fromArray(SC.A),k*0.5);
      this.cur.B.lerp(new THREE.Vector3().fromArray(SC.B),k*0.5);
      this.cur.D.lerp(new THREE.Vector3().fromArray(SC.D),k*0.5);
      const kf=1-Math.exp(-s/1.1);
      this.domeAmt+=((menu?0:SC.dome)-this.domeAmt)*kf;
      this.orbAmt+=((menu?0:SC.orb)-this.orbAmt)*kf;
      this.texAmt+=(((menu||!SC.tex)?0:SC.tex[0])-this.texAmt)*kf;
      const wm=menu?0:SC.wall;
      for(let i=0;i<3;i++){ const on=(wm===3)||(wm===1&&i===0)||(wm===2&&i>0);
        this.wAmt[i]+=((on?1:0)-this.wAmt[i])*kf; }

      // ---- nieuwe tunnel schuift over je heen bij elk hoofdstuk ----
      let cut=99999, dir=-1, introA=menu?0:1;
      if(!menu&&SC.intro){ introA=Math.min(1,Math.max(0,(tEl-5)/9));
        if(tEl<19) { cut=-230+260*Math.min(1,Math.max(0,(tEl-5)/12)); dir=-1; } }
      else if(!menu&&tEl<3.2){ cut=-200+230*(tEl/3.2); dir=-1; }

      // ---- rimpel ----
      if(!menu&&Math.random()<s*SC.rip*0.5) this.fireRipple();
      if(this.ripAmp>0){ this.ripZ+=s*250; this.ripAmp=Math.max(0,this.ripAmp-s*0.42);
        if(this.ripZ>60){ this.ripAmp=0; this.ripZ=9999; } }
      // ---- bliksem, vooral als het donker is ----
      if(!menu&&SC.light&&hit&&Math.random()<0.35) this.flash=Math.max(this.flash,0.85);
      if(!menu&&hit&&Math.random()<0.02) this.flash=Math.max(this.flash,0.3);
      this.flash=Math.max(0,this.flash-s*3.2);
      const fpl=$('#flash'); if(fpl) fpl.setAttribute('material','color:#dfe8ff;opacity:'+(this.flash*0.45).toFixed(3)+';transparent:true;shader:flat');

      // ---- tunnel ----
      for(let i=0;i<3;i++){ const u=this.shells[i].u, par=[1.0,0.45,0.2][i];
        u.uTime.value+=s*(0.5+this.cur.sp*0.22*par);
        u.uSpeed.value=this.cur.sp*par*1.6;
        u.uWave.value=this.cur.wave*(i===0?1:0.6);
        u.uFold.value=this.cur.fold; u.uBeat.value=beat; u.uFlash.value=this.flash*0.6;
        u.uWhite.value=(SC.white?pr*pr:0);
        u.uAlpha.value=this.shells[i].base*introA; u.uDark.value=1;
        u.uTexAmt.value=this.texAmt; u.uTexRep.value=[3.0,3.35,3.75][i];
        if(SC.tex&&SC.tex[0]>0) u.uTex.value=getPrints()[SC.tex[1]||0];
        u.uCut.value=cut; u.uCutDir.value=dir;
        u.uColA.value.copy(this.cur.A); u.uColB.value.copy(this.cur.B); u.uColD.value.copy(this.cur.D);
        u.uRipZ.value=this.ripZ; u.uRipAmp.value=this.ripAmp*(i===0?0.9:0.5); }
      // ---- bol om je heen ----
      this.du.uTime.value+=s*(0.35+this.cur.sp*0.05);
      this.du.uBeat.value=beat*0.7; this.du.uFlash.value=this.flash*0.5;
      this.du.uWhite.value=(SC.white?pr*pr:0); this.du.uFold.value=this.cur.fold;
      this.du.uDark.value=this.domeAmt;
      this.du.uColA.value.copy(this.cur.A); this.du.uColB.value.copy(this.cur.B); this.du.uColD.value.copy(this.cur.D);
      this.dome.visible=this.domeAmt>0.02;
      // ---- bol aan het eind: naar je toe en weer weg ----
      let oz, osc=this.orbAmt;
      if(!menu&&SC.intro){ const g=Math.min(1,Math.max(0,tEl/19)); osc=this.orbAmt*(0.10+0.90*g); oz=-155+58*g; }
      else if(SC.orbNear) oz=-(21+26*(0.5+0.5*Math.sin(this.elapsed*0.20)));
      else oz=-(34+80*(0.5+0.5*Math.sin(this.elapsed*0.115)));
      this.orb.position.z=oz;
      this.orb.scale.setScalar(osc*(1+beat*0.08));
      this.orb.visible=osc>0.03;
      this.ou.uTime.value+=s*(0.7+this.cur.sp*0.1);
      this.ou.uBeat.value=beat; this.ou.uFlash.value=this.flash*0.8; this.ou.uFold.value=this.cur.fold;
      this.ou.uWhite.value=(SC.white?pr*pr:0); this.ou.uDark.value=1;
      this.ou.uColA.value.copy(this.cur.A); this.ou.uColB.value.copy(this.cur.B); this.ou.uColD.value.copy(this.cur.D);
      // ---- wanden ----
      const pulse=(x)=>Math.pow(Math.max(0,Math.sin(Math.PI*(x-Math.floor(x)))),0.65);
      for(let i=0;i<3;i++){ const w=this.walls[i], u=w.u;
        u.uTime.value+=s*(0.5+this.cur.sp*0.3);
        u.uSpeed.value=this.cur.sp*2.2; u.uFold.value=this.cur.fold;
        u.uBeat.value=beat; u.uFlash.value=this.flash*0.6; u.uWhite.value=(SC.white?pr*pr:0);
        u.uAlpha.value=0.55*this.wAmt[i]; u.uDark.value=1;
        u.uColA.value.copy(this.cur.A); u.uColB.value.copy(this.cur.B); u.uColD.value.copy(this.cur.D);
        w.m.visible=this.wAmt[i]>0.03;
        if(i===0){ const p=pulse(this.elapsed/11); w.m.position.y=-30+26.5*p; }
        else if(i===1){ const p=pulse(this.elapsed/15+0.15); w.m.position.x=-42+34*p; }
        else { const p=pulse(this.elapsed/15+0.65); w.m.position.x=42-34*p; } }

      // ---- verschijningen ----
      const e0=4, e1=Math.max(e0+6,this.scDur-4);
      const evOn=(!menu&&SC.ev>=0&&tEl>e0&&tEl<e1);
      const eu=evOn?(tEl-e0)/(e1-e0):0;
      for(let p=0;p<5;p++){ const on=(evOn&&SC.ev===p);
        for(let j=0;j<this.pools[p].length;j++){ const o=this.pools[p][j], u=o.u;
          if(!on){ if(o.m.visible) o.m.visible=false; continue; }
          o.m.visible=true;
          u.uTime.value+=s*1.6; u.uBeat.value=beat; u.uFlash.value=this.flash;
          u.uWhite.value=(SC.white?pr*pr:0); u.uDark.value=1;
          u.uRipZ.value=this.ripZ; u.uRipAmp.value=this.ripAmp;
          u.uColA.value.copy(this.cur.A); u.uColB.value.copy(this.cur.B); u.uColD.value.copy(this.cur.D); }
        if(!on) continue;
        if(p===3){ // SLANG: golft langs je heen
          const fly=24+this.cur.sp*3.0; this.snakeZ+=fly*s;
          for(let j=0;j<16;j++){ const o=this.pools[3][j]; const zz=this.snakeZ-j*2.6;
            o.m.position.set(this.snakeSide*(8.5+Math.sin(zz*0.045+this.elapsed*0.6)*4.0),
                             1.6+Math.cos(zz*0.038+this.elapsed*0.5)*4.5, zz);
            o.m.scale.setScalar(1.8*(1-j/23)); }
        } else if(p===0||p===4){ this.evPhase+=s*(0.5+8.5*eu*eu);
          const zc=-13-7.0*Math.sin(eu*Math.PI*2.2), rr=3.4;
          for(let j=0;j<this.pools[p].length;j++){ const o=this.pools[p][j];
            const a=this.evPhase+j/this.pools[p].length*6.283;
            o.m.position.set(Math.cos(a)*rr,1.6+Math.sin(a)*rr,zc);
            o.m.rotation.z=a*1.4; o.m.rotation.y+=s*1.2;
            o.m.scale.setScalar(0.85+0.3*Math.sin(eu*9+j)); }
        } else if(p===1){ const fly=26+this.cur.sp*3.2;
          for(let j=0;j<this.pools[1].length;j++){ const o=this.pools[1][j];
            o.m.position.z+=fly*s;
            o.m.position.x=Math.sin(this.elapsed*0.5+j)*1.3; o.m.position.y=1.6+Math.cos(this.elapsed*0.4+j)*0.9;
            o.m.rotation.z+=o.spin*s;
            if(o.m.position.z>12) o.m.position.z-=6*26; }
        } else { const fly=30+this.cur.sp*4.2;
          for(let j=0;j<this.pools[2].length;j++){ const o=this.pools[2][j];
            o.z-=fly*s; o.ang+=o.spin*0.25*s;
            o.m.position.set(Math.cos(o.ang)*o.rad,1.6+Math.sin(o.ang)*o.rad*0.7,o.z);
            o.m.rotation.z+=o.spin*s; o.m.rotation.y+=o.spin*0.5*s;
            if(o.z<-170){ o.z=25+rand(0,20); o.rad=rand(2.8,9); o.ang=rand(0,6.283); } }
        }
      }
      if(!menu){ if(this.elapsed>=TRACK1_END) switchTrack();
        if(this.elapsed>=TOTALT) endTrip(); } }
  });

  // =========================================================
  //  START / EINDE
  // =========================================================
  function startTrip(){ if(window.PHASE!=='menu') return; AC();
    if(TRACKS[0]||TRACKS[1]){ try{
      ANA=A.createAnalyser(); ANA.fftSize=256; ANAD=new Uint8Array(ANA.frequencyBinCount); ANA.connect(MASTER);
      TRACKS.forEach(function(tr,i){ if(!tr) return; const src=A.createMediaElementSource(tr); const g=A.createGain();
        g.gain.value=(i===0)?1:0; src.connect(g).connect(ANA); TGAIN[i]=g; });
      if(!TRACKS[0]&&TGAIN[1]) TGAIN[1].gain.value=1;
      if(TRACKS[0]){ TRACKS[0].loop=false; TRACKS[0].addEventListener('ended',function(){ switchTrack(); }); }
      if(TRACKS[1]){ TRACKS[1].preload='auto'; try{ TRACKS[1].load(); }catch(e){} }
      (TRACKS[0]||TRACKS[1]).play(); window.USE_TRACK=true; }catch(e){ window.USE_TRACK=false; } }
    if(!window.USE_TRACK) startDrone();
    const m=$('#menu'); if(m&&m.parentNode)m.parentNode.removeChild(m);
    document.querySelectorAll('.hand').forEach(function(h){ h.removeAttribute('cursor'); h.removeAttribute('raycaster');
      const l=h.querySelector('.menu-laser'); if(l&&l.parentNode)l.parentNode.removeChild(l); h.setAttribute('visible',false); });
    $('#reticle').setAttribute('visible',false);
    window.PHASE='trip'; }
  function endTrip(){ if(window.PHASE!=='trip') return; window.PHASE='end';
    if(MASTER) MASTER.gain.linearRampToValueAtTime(0.12,A.currentTime+3);
    document.querySelectorAll('.hand').forEach(function(h){ h.setAttribute('visible',true);
      h.setAttribute('raycaster','objects: .menu-btn; far: 12');
      h.setAttribute('cursor','fuse: false; downEvents: triggerdown; upEvents: triggerup; rayOrigin: entity');
      const l=document.createElement('a-entity'); l.setAttribute('class','menu-laser');
      l.setAttribute('line','start: 0 0 0; end: 0 0 -12; color: #ffd98a; opacity: 0.5'); h.appendChild(l); });
    $('#reticle').setAttribute('visible',true);
    $('#endscreen').setAttribute('visible',true); }
  </script>
</head>
<body>
  <div id="loader"><div style="font-size:22px;letter-spacing:4px">DIEPE TRIP</div>
    <div style="font-size:16px;color:#5ad0ff;margin-top:6px">v13.3</div>
    <div id="ldPhase" style="font-size:15px;color:#8a7aa8;margin-top:10px">laden…</div><div id="ldErr"></div></div>
  <script>
    window.SCENE_LOADED=false; window.T0=Date.now();
    window.onerror=function(msg,src,line,col){ var e=document.getElementById('ldErr');
      if(e) e.textContent+='FOUT: '+msg+' @ '+line+':'+col+'\n'; return false; };
    (function poll(){ var l=document.getElementById('loader'); if(!l) return;
      if(window.SCENE_LOADED){ l.style.display='none'; return; }
      var secs=Math.round((Date.now()-window.T0)/1000);
      if(secs>=12) document.getElementById('ldPhase').textContent='laadt niet ('+secs+'s) — maak een foto van dit scherm';
      setTimeout(poll,150); })();
  </script>
  <a-scene loading-screen="enabled: false" renderer="colorManagement: true; antialias: true; foveationLevel: 1"
           background="color: #000000">
    <a-entity id="rig" position="0 0 0" shaderworld>
      <a-entity id="menu">
        <a-plane position="0 1.55 -2.1" width="1.9" height="1.15" material="color:#0a0714;opacity:0.93;transparent:true"></a-plane>
        <a-plane position="0 1.55 -2.11" width="1.98" height="1.23" material="color:#b04aff;opacity:0.16;transparent:true"></a-plane>
        <a-text value="DIEPE TRIP" align="center" color="#d8b0ff" width="4.2" position="0 1.95 -2.08"></a-text>
        <a-text value="Acht minuten. Twee tracks." align="center" color="#9aa8c0" width="1.8" position="0 1.74 -2.08"></a-text>
        <a-text value="Zet je geluid aan." align="center" color="#7c8794" width="1.6" position="0 1.63 -2.08"></a-text>
        <a-text id="trkInfo" value="tracks zoeken..." align="center" color="#7c8794" width="1.5" position="0 1.52 -2.08"></a-text>
        <a-plane id="btnStart" class="menu-btn" position="0 1.3 -2.08" width="1.3" height="0.34" material="color:#5a1f7a;opacity:0.97;transparent:true"></a-plane>
        <a-text value="START" align="center" color="#fff" width="3.4" position="0 1.3 -2.07"></a-text>
        <a-text value="v13.3" align="right" color="#5ad0ff" width="1.4" position="0.86 1.02 -2.07"></a-text>
      </a-entity>
      <a-entity id="endscreen" visible="false">
        <a-plane position="0 1.55 -2.1" width="1.9" height="1.05" material="color:#0a0714;opacity:0.95;transparent:true"></a-plane>
        <a-text value="EINDE" align="center" color="#ffd98a" width="5" position="0 1.85 -2.08"></a-text>
        <a-text value="Welkom terug." align="center" color="#9aa8c0" width="1.8" position="0 1.62 -2.08"></a-text>
        <a-plane id="btnAgain" class="menu-btn" position="0 1.32 -2.08" width="1.2" height="0.28" material="color:#5a1f7a;opacity:0.97;transparent:true"></a-plane>
        <a-text value="NOG EEN KEER" align="center" color="#fff" width="2.6" position="0 1.32 -2.07"></a-text>
      </a-entity>
      <a-camera wasd-controls-enabled="false" far="400">
        <a-cursor id="reticle" color="#d8b0ff" fuse="false" raycaster="objects: .menu-btn"></a-cursor>
        <a-plane id="flash" position="0 0 -0.32" width="2.6" height="2.6" material="color:#dfe8ff;opacity:0;transparent:true;shader:flat"></a-plane>
      </a-camera>
      <a-entity id="leftHand" class="hand" meta-touch-controls="hand: left"
                raycaster="objects: .menu-btn; far: 12"
                cursor="fuse: false; downEvents: triggerdown; upEvents: triggerup; rayOrigin: entity">
        <a-entity class="menu-laser" line="start: 0 0 0; end: 0 0 -12; color: #d8b0ff; opacity: 0.5"></a-entity>
      </a-entity>
      <a-entity id="rightHand" class="hand" meta-touch-controls="hand: right"
                raycaster="objects: .menu-btn; far: 12"
                cursor="fuse: false; downEvents: triggerdown; upEvents: triggerup; rayOrigin: entity">
        <a-entity class="menu-laser" line="start: 0 0 0; end: 0 0 -12; color: #d8b0ff; opacity: 0.5"></a-entity>
      </a-entity>
    </a-entity>
    <script>
      window.addEventListener('load',function(){ try{
        var sc=document.querySelector('a-scene');
        if(sc.hasLoaded) window.SCENE_LOADED=true;
        else { sc.addEventListener('loaded',function(){ window.SCENE_LOADED=true; });
               sc.addEventListener('renderstart',function(){ window.SCENE_LOADED=true; }); }
        tryTrack();
        document.querySelector('#btnStart').addEventListener('click',function(){ startTrip(); });
        document.querySelector('#btnAgain').addEventListener('click',function(){ location.reload(); });
      }catch(e){ var el=document.getElementById('ldErr'); if(el) el.textContent+='FOUT: '+e.message+'\n'; } });
    </script>
  </a-scene>
</body>
</html>
